issuer_defects:
  - type: check_does_not_check
    note: "Task 2 Step 3 の照合が主張する問いに答えていない。中継の鍵 id_ed25519_bengiotophilip はコメントが ubuntu@Bengio であり自ホストが出て行くための鍵である。それを自分の受け入れ一覧と照合しても自分自身へ入れるかしか分からない。中心になれるかを決めるのは他ノードの鍵が登録されているかである。指示どおりの照合（結果 0）も記録したうえで、手元の鍵と受け入れ一覧を集合として突き合わせ、遠隔ノード由来の登録が 2 件であることを測った"
  - type: self_contradiction
    note: "Task 3 Step 2 の命令が禁止 2 と衝突する。StrictHostKeyChecking=accept-new は未知のホスト鍵を ~/.ssh/known_hosts へ書き込むが、禁止 2 は ~/.ssh 配下の変更を禁じている。意図を保つため UserKnownHostsFile を一時領域へ向け、実行前後で known_hosts の要約値と更新時刻が不変であることを測って示した"
  - type: asserted_without_measuring
    note: "Task 3 Step 2 の陰性対照と本測定がいずれも Permission denied という同じ文言を返すため、それだけでは鍵を提示したうえでの拒否か提示せずの拒否かを区別できない。詳細出力で分けたところ、実鍵は Offering public key まで到達しており、/dev/null は Trying private key で止まって提示に至らないことが分かった"

