      そのホストの自動同期が止まったままになる。
  - type: self_contradiction
    note: >-
      Task 3 Step 3 は「退避したものを戻す」として、退避した digest を未追跡に戻させる。しかし tasks/README.md は、
      抽出物を契約の記録と一緒に版管理へ含めよと定めている。指示どおりに実行すると未追跡が残り、
      次の契約の task-start が前提検査で止まり、自動統合も止まる。

