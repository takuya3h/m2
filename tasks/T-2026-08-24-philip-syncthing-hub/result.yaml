issuer_defects:
  - type: check_does_not_check
    note: "SPEC Task3 Step3 は実行ファイル名で数えて『同期処理が一件』を期待するが、Syncthing は monitor が worker を fork する構成のため正常な単一起動でも必ず 2 を返す。指示どおり実行すると二重起動と誤認して停止・報告することになる。実際に 2 が出たため、親 PID と STMONITORED 環境変数で monitor(122452, 親は keeper 72428) と worker(122530) を切り分ける必要があった。"
  - type: check_does_not_check
    note: "SPEC Task1 Step2 の秘匿検査は grep -c 'BEGIN.*PRIVATE' のみで、期待値 0 を確かめて版管理へ置かせる。しかし config.xml には GUI の apikey が実値で入っており、この検査では検出されない。指示どおり実行すると秘匿値がそのまま版管理に入る。実際に Task4 Step4 の広い検査で 1 件検出され、実行者がマスクした。Task4 の検査が Task1 の検査の穴を塞いでいる形になっている。"
  - type: shell_assumption
    note: "SPEC Task3 Step6 は tail -30 ~/claude-sync/syncthing.log を読ませるが、起動元である keeper.sh:42 の出力先は ~/.syncthing.log であり、指定されたファイルは存在しない。指示どおり実行すると『記録なし』となり、起動時の異常を見落とす。実際に自動アップグレードの記録は ~/.syncthing.log にしかなく、これを読まなければ本体が入れ替わったことに気づけなかった。"
  - type: asserted_without_measuring
    note: "SPEC Task2 Step3 は『全台が空なので sendreceive でよい（前契約で八キロバイトと確認済み）』と断定するが、前契約の handoff は『他 4 台の中身を測っていないため空の側が sendreceive で参加すると中身を消しうる』と明記して型を UNKNOWN として残している。八キロバイトは philip 単独の実測値であり、全台の実測ではない。指示どおり読むと未測定の事項を確定事項と誤認する。"
  - type: self_contradiction
    note: "SPEC 禁止1は『他ホストへ接続する。他ホストの状態を変更する』を禁じるが、SPEC が正とすると定めた handoff は『作業前に 5 台とも 644 であることを確かめる』と『事前に全台の find ~/claude-sync -type f の件数を測っておく』を求める。両立しない。本契約では禁止1を優先し、他 4 台の状態は UNKNOWN のままとした。"
  - type: self_contradiction
    note: "SPEC Task4 Step1 は『完了判定 16 項目を表にまとめ』と書くが、契約全体の完了判定表は Task1 の 4 件、Task2 の 6 件、Task3 の 6 件、Task4 の 6 件で合計 22 項目ある。指示どおり 16 項目だけ書くと Task4 自身の判定 17 から 22 が報告から抜ける。本報告では 22 項目すべてを表にした。"

