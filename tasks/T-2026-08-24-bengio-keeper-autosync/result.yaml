issuer_defects:
  - type: self_contradiction
    note: >-
      SPEC の表は keeper.sh の三十九から五十行を「同期処理の監視、除外規則の反映、
      版管理の同期」として「これを動かす」と書くが、41-43 行は同期処理そのものの起動である。
      判定条件は [ -x ~/bin/syncthing ] だけで目印の有無に依存しない。指示どおり
      keeper を起動すると syncthing が起動し、禁止 2「同期処理を起動する」と
      完了判定 11「同期処理が零件」を同時に破る。さらに keeper は 1800 秒ごとに
      再起動を試みるため、一度止めても周回のたびに立ち上がり続ける。
  - type: shell_assumption
    note: >-
      Task 2 Step 2 は sh -n で正本を検査し「両方が零であること」と断定するが、
      /bin/sh は dash への連結であり、m2-sync.sh は #!/bin/bash を宣言して 74-76 行で
      bash 固有のプロセス置換 <(...) を使う。指示どおり実行すると m2sync_syntax=2 が出る。
      壊した写しも同じ 2 を返すため終了コードでは区別できず、実行者は正本が壊れていると
      判断して停止するか、正本を「直して」しまう。正しい検査器 bash -n では両方 0。
  - type: asserted_without_measuring
    note: >-
      Task 4 Step 5 は「送出側が git@ で始まるなら、配備鍵が要る形である。鍵は消えている」と
      断定し、git remote set-url --push origin https://… を指示する。bengio では実測の結果
      ssh -T git@github.com が「Hi takuya3h!」を返し、gh auth status も takuya3h で
      ログイン済み（protocol: ssh）だった。鍵は消えていない。指示どおり https へ切り替えると
      動いている経路を壊し、credential.helper の設定が無いため push できなくなる。
      切り替えずに push したところ成功した。前契約 T-2026-08-22-bengio-node-foundation でも
      同じ前提が偽であり、二度目である。

