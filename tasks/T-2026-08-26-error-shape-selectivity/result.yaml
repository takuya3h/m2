issuer_defects:
  - type: self_contradiction
    note: >-
      outputs.destination が experiments/analysis/error_shape_selectivity/ を指すのに、
      forbidden-check は experiments/ を禁止領域として扱う。指示どおり成果物を置くと必ず違反になり、
      実測で 26 件が報告された。SPEC §5 は「本契約は新しい run を作らないため、失敗するなら別の原因」と
      書くが、run を作らなくても成果物を置くだけで違反になる。この記述は実行者を誤った診断へ導く。
  - type: asserted_without_measuring
    note: >-
      申し送り 2 が「孤立した反転と持続する誤りが同じ仕組みの両端として扱えるかは未確認。別々の
      仕組みなら二つを一つの軸に載せられない」とするが、実測では burst の L=1 が iid とビット単位で
      同一だった（p 5 水準×種 3 本で異なる位置数 0、乱数の消費順序まで一致）。指示どおり二つを
      別々に掃引していれば、同じ計算を二度行って格子を二重に持つことになっていた。
  - type: asserted_without_measuring
    note: >-
      申し送り 3 が「持続の長さを変える手続きが実装されているかは未確認。無い場合 軸二の掃引は
      できない。実装を新たに書き起こすかどうかは残り時間を見て判断してよい」とするが、L は原典
      add_noise の引数として実装済みだった。書き起こしの検討自体が不要であり、指示に従うと
      存在する機能を再実装しかねない。
  - type: check_does_not_check
    note: >-
      SPEC Task 3 Step 2 は「陰性対照 — 誤りを与えない場合。分類も分節も損失は零のはずである」と
      求めるが、原典の build は add_noise(...) if p>0 else X と分岐するため p=0 では誤りを与える
      手続きを一度も呼ばない。指示どおり p=0 を流すと必ず零になるが、それは構造上の零であって
      add_noise の欠陥を検出できない。経路を通す対照（add_noise を直接 p=0 で呼ぶ）を別に足した。
  - type: asserted_without_measuring
    note: >-
      SPEC §0 は「本契約は他の四台と同時に走っている」と述べるだけで、同時実行の実害に触れていない。
      指示どおり成果物を outputs.destination へ置いて実行すると、実装が実行中に同期処理へ削除される。
      2026-08-25 21:59:55 に本契約の .py 2 件と、別の契約（lovo_decision_rule）の .py 2 件が消えた。
      抑止の目印（.sync-pause）は git 操作しか止めないため、SPEC の Task 1 Step 3 では防げない。
  - type: check_does_not_check
    note: >-
      完了判定 o「変更範囲の一覧を出した」を forbidden-check で測ると、起点が origin/phase0 に
      固定されている。契約の実行中に phase0 が進むため（実測: PR #152 で 4 commit 先へ）、
      他契約の追加が自分の「削除」として一覧に現れる（実測 7 件）。指示どおり一覧を読むと、
      触れてもいない experiments/transfer/ を自分が消したと誤読する。

