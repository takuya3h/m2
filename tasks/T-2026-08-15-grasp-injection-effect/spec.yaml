spec_version: 1
meta:
  task_id: "T-2026-08-15-grasp-injection-effect"
  kind: exp
  title: "把持の推論結果を工程分類へ渡したときの効果を測る"
  origin: claude-app
  created_at: "2026-08-15T09:30:00Z"
  created_from:
    runindex_commit: "44697d9"
    counts: {index: 751, experiments: 207, verdicts: 1038}
  depends_on:
    - "T-2026-08-11-grasp-inference-injection-impl"
    - "T-2026-08-11-phase-baseline-power"
    - "T-2026-08-11-grasp-linear-probe"
  amendments: []
intent:
  question: "手と術具の把持の対応を推論し、その結果を工程分類の入力へ渡すと、無情報な信号を渡した場合に比べて工程の精度が上がるか"
  hypothesis: "推論結果を渡した腕が、無情報な信号を渡した腕を上回る"
  decision_at_stake: "把持の対応を補助信号として使う方向を進めるか、やめるか。効果が出なければ、渡す信号の形か推論の質のどちらに原因があるかも切り分ける"
  related:
    backlog: ["BL-frozen-source-self-contradiction"]
inputs:
  denominator:
    ref: "exp:phase1/s4_phase_baseline/frozen_tecno_phase_baseline@val~relation_detr_seed42"
    metric: "accuracy"
    require:
      n_seeds: ">=3"
      sigma: present
      split: val
  sigma_policy:
    series: pstd
    sigma_source: paired_delta
    delta_sigma_source: paired
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints:
      - "scripts/train_grasp_phase_injection.py"
      - "src/egosurgery/models/temporal/grasp_inference_injection.py"
      - "tools/harvest_runindex.py"
prereg:
  prediction: "推論結果を渡した腕が無情報な信号を渡した腕を上回る。すなわち対の差が正である"
  primary_endpoint: "測る側 val の accuracy について、同じ種で対にして取った差。推論結果を渡した腕から無情報な信号を渡した腕を引く"
  decision_rule: "対の差の絶対値を対の差の揺らぎで割った値が一以上であり、かつ全ての種で符号が揃うときに効果ありとする。満たさない場合、差の大きさが prereg.md に定めた検出できる下限を下回るならば検出できずと述べ、効果なしとは述べない"
  stop_conditions:
    - "六本を走らせ終えた"
    - "計算装置が使えず走らせられない"
    - "学習が落ちて完走しない"
  commit: "34572bbddd7f37c0305b94b93192f8f136150e97"
contract:
  inject_verbatim: [conventions#prohibitions]
  conventions_rev: "d422b08"
  prohibitions:
    - no_split_redefine
    - no_raw_write
    - no_frozen_change
    - no_runindex_hand_edit
    - no_estimated_values
  verbatim_forbidden: true
plan:
  phases:
    - {id: A, name: "前提を確かめ、事前登録を版管理へ固定する", gpu: false, est: "40m"}
    - {id: B, name: "二つの腕を三つの種で走らせる", gpu: true, est: "10h"}
    - {id: C, name: "対の差と推論の出来を測る", gpu: false, est: "50m"}
    - {id: D, name: "総括と次への申し送り", gpu: false, est: "30m"}
  gates:
    - id: G1
      after: A
      check: "凍結特徴と実装が本ホストに在ることを確かめ、事前登録を版管理へ固定してから走らせる前に刻んだ"
      on_fail: stop
    - id: G2
      after: B
      check: "六本すべてが完走し、二つの腕の重みの総数が等しく、評価条件が分母と一致することを確かめた"
      on_fail: stop
    - id: G3
      after: C
      check: "対の差を事前登録の決め方どおりに求め、結果を見てから決め方を変えていない"
      on_fail: stop
  env:
    venv: ".venv"
    preflight: [venv_active]
outputs:
  must_have: [RESULT.md]
  destination: "experiments/"
  expected_runs: 6
  stamp:
    task_id_in: "metrics.json"
  acceptance:
    - "対の差と、その揺らぎと、種ごとの符号が示されている"
    - "推論の出来が五つの次元それぞれについて示され、線形の下見の値と比べられている"
    - "効果ありと述べられない場合に、検出できずと効果なしのどちらであるかが区別されている"
    - "一本あたりの所要時間が実測で記録されている"
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "二つの腕の重みの総数が一致せず、差に容量の分が混ざると判明した場合"
    - "推論の出来が偶然並みで、渡している信号に情報が無いと判明した場合"
    - "他の利用者が計算装置を使用中で、学習を行うと妨げになる場合"
