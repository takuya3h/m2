      reason: "preflight P6 が未回答 3 件で FAIL し、利用者に 3 項目を示した。利用者の回答「とにかく進めてくれ しばらく見れないからなんとかしてとにかく実験回して」（2026-11-21）。判断を実行者に委ねた回答と読み、次のとおり前もって決めた。(1) 停止条件: 読みの曖昧さや手順の選択は実行者が決め、逸脱として記録して続ける。gate の FAIL（on_fail: stop）、捏造の禁止と未測定の UNKNOWN、allow_write の外への書き込み、他の契約の compute を止めることは委ねられたものに含めず、当たれば止める（他の契約の compute が在れば止めずに空くのを待つ）。(2) T→P の型の間で学習設定が食い違えば、W ごとにその W の T→P の run（W1 は stage2fix_*、W2・W3 は w23b_*）の記録の値を写し、食い違いを報告に書く。(3) グラフの定義は変えない。入れ替えはフレームごとの行の並べ替えで、定義を変えずに作れる。変えないと作れない場合は止める"
