      断定するが、これは bengio の実測であって andrew には当てはまらない。本ホストの実測は
      du -sb で 54745194976 バイト、syncthing の global で 42010521855 バイト / 5193 件である。
      指示どおり「五十一ギガ」を前提にすると、初回同期の所要や残量の見積もりを誤る。
      ホスト非依存の定数として書かれている値を、実行者が実測で置き換える必要があった。
  - type: asserted_without_measuring
    note: >-
      SPEC Task 3 Step 2 と「前契約で確定した事実」表は起動の引き金の周期を「最大六十分」と書くが、
      稼働している keeper.sh の実装は sleep 1800（30 分）である。実測は目印 15:18:02Z から
      中継 15:38:29Z までの 1227 秒で、実装と一致する。指示どおり 60 分を上限として待つと、
      異常の判定（想定外の表「六十分待っても起きなければ報告」）が実装の 2 倍遅れる。
  - type: check_does_not_check
    note: >-
      SPEC Task 4 Step 2 は availability に中心の識別子が現れるかを見よと指示するが、
      置いた直後は syncthing の索引に入っておらず同じ問いが HTTP 404 を返すことに触れていない。
