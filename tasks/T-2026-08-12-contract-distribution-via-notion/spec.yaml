spec_version: 1

meta:
  task_id: "T-2026-08-12-contract-distribution-via-notion"
  kind: impl
  title: "契約の配布を外部の共有台帳経由にし、実行時に取り込めるようにする"
  origin: claude-app
  created_at: "2026-08-12T09:00:00Z"
  created_from:
    runindex_commit: "12cc0e8"
    counts: {index: 749, experiments: 206, verdicts: 1038}
  depends_on: ["T-2026-08-11-canonical-index-refresh"]
  amendments: []

intent:
  question: "起票者が書いた契約を、貼り付けなしで実行ホストへ渡せるか"
  decision_at_stake: "配布を共有台帳経由にするか、貼り付けを続けるか"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints: ["tools/fetch_task.py"]

contract:
  inject_verbatim: [conventions#prohibitions]
  conventions_rev: "d422b08"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_runindex_hand_edit, no_estimated_values]
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "共有台帳への到達性の確認", gpu: false, est: "40m"}
    - {id: B, name: "往復の忠実性の検証", gpu: false, est: "50m"}
    - {id: C, name: "取り込み経路の実装", gpu: false, est: "60m"}
    - {id: D, name: "手順書への組み込みと自己契約", gpu: false, est: "40m"}
  gates:
    - id: G1
      after: A
      check: "実行ホストの資格情報で台帳を照会でき、対象の行を特定できることを確認した"
      on_fail: stop
    - id: G2
      after: B
      check: "書き込んだ内容と読み戻した内容が一文字も違わないことを要約値で確認した"
      on_fail: stop
    - id: G3
      after: C
      check: "識別子だけを与えて契約を取り込め、失敗時に痕跡が残らないことを確認した"
      on_fail: stop
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "tools/"
  acceptance:
    - "実行ホストの資格情報で台帳を照会できる"
    - "書き込みと読み戻しで内容が変わらないことが要約値で確認されている"
    - "識別子だけを与えて契約を取り込める"
    - "取り込みに失敗した場合に作業領域へ痕跡が残らない"
    - "手元に契約が無いとき自動で取得する経路が手順書に書かれている"
    - "資格情報が出力にも記録にも含まれない"
    - "make task-validate が exit 0"
    - "make task-preflight が exit 0"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: [ledger_unreachable, roundtrip_mismatch, secret_value_printed]
