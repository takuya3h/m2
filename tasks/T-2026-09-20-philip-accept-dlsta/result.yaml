issuer_defects:
  - type: asserted_without_measuring
    note: >-
      SPEC が「共有相手の属性名は id。deviceID ではない（前契約で誤った）」と断定したが、稼働中の
      REST v2.1.3 の folder.devices[] のキーは deviceID / introducedBy / encryptionPassword である。
      id は config.xml 側の属性名で、SPEC は二つの表現を取り違えている。指示どおり id を送れば、
      相手の一覧が識別子を持たない要素に置き換わり、既存 6 台の共有が壊れうる。実在する名前を
      GET で読んでから deviceID を使った。
  - type: check_does_not_check
    note: >-
      L3 の P9 spec_lint の host_mismatch は socket.gethostname() と本文の宣言を比べる。philip と ilya は
      どちらも aolab を返すため（m2-sync.sh の註に明記）、この判定はホストの同一性を判定できていない。
      指示どおり従えば、正しいホストで実行しても毎回 WARN が出る一方、ilya で誤って実行しても同じ
      WARN しか出ず区別できない。.servername と GET /rest/system/status の myID で同一性を確かめた。

