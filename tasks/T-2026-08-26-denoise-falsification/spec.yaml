  kind: exp
  title: "入力側の雑音除去が本番の受容野で効かないことの反証テストと環境の棚卸し"
  origin: claude-app
  chat_url: ""
  created_at: "2026-08-25T22:00:00Z"
  created_from:
    runindex_commit: "44697d9a402cb52a2b800220cdd5976c0a656ca6"
    counts: {index: 751, experiments: 207, verdicts: 1038}
  depends_on: []
  amendments:
