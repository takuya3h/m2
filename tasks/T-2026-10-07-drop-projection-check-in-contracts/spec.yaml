spec_version: 1

meta:
  task_id: "T-2026-10-07-drop-projection-check-in-contracts"
  kind: impl
  title: "契約の手順と検証から、生成物の作り直しと鮮度の検査を外す"
  origin: claude-app
  created_at: "2026-10-07T08:30:00Z"
  created_from:
    runindex_commit: "1eb6364"
    counts: {index: 751, experiments: 207, verdicts: 1038}
  depends_on: ["T-2026-10-07-auto-regen-projections"]
  amendments: []

intent:
  question: "生成物は本線への統合を契機に自動で作り直されるようになった。契約の分岐では作り直しを禁じているため、検証で鮮度の検査が毎回落ち、実行者の手順書は作り直しを求めて禁止と食い違う。呼び出し元を洗い出し、契約の流れからだけ外して、検査そのものは本線で使えるように残せるか"
  decision_at_stake: "契約の報告から意図した失敗の記述を無くせるか。外しすぎると他の検査まで止まる。呼び出し元を名前だけで探すと間接の経路を見落とす。外した後に他の検査と鮮度の検査が単独で働くことを陽性対照で確かめる"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints:
      - "Makefile"
      - ".claude/skills/task/SKILL.md"

contract:
  inject_verbatim: [conventions#prohibitions, conventions#issuer_cautions]
  conventions_rev: "073f9dc"
  prohibitions:
    - no_split_redefine
    - no_raw_write
    - no_frozen_change
    - no_runindex_hand_edit
    - no_estimated_values
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "作り直しと鮮度の検査の呼び出し元の洗い出しと分類", gpu: false, est: "40m"}
    - {id: B, name: "契約の流れからだけ外し、外しすぎていないことを確かめる", gpu: false, est: "50m"}
    - {id: C, name: "報告と送出", gpu: false, est: "30m"}
  gates:
    - id: G1
      after: A
      check: "作り直しと鮮度の検査を直接名指す箇所を行番号つきで列挙し、間接の経路を記録した。契約の流れで効いている箇所と、それ以外で使う箇所を分類した"
      on_fail: ask
    - id: G2
      after: B
      check: "手順書から作り直しを外し、契約の検証から鮮度の検査の呼び出しを外した。検査の目標そのものは残っている。契約の検証が鮮度で落ちないこと、他の検査と鮮度の検査が単独では働くことを陽性対照で示した"
      on_fail: stop
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "tasks/T-2026-10-07-drop-projection-check-in-contracts/"
  acceptance:
    - "作り直しと鮮度の検査の呼び出し元を、直接と間接の両方で洗い出している"
    - "契約の流れで効いている箇所と、それ以外で使う箇所を分類している"
    - "手順書から作り直しを外し、理由を添えている"
    - "契約の検証から鮮度の検査の呼び出しを外し、目標そのものは残している"
    - "契約の検証が生成物の鮮度で落ちないことを示している"
    - "他の検査が陽性対照で落ちることを示し、弱めていない"
    - "鮮度の検査が単独では差分を検出することを示している"
    - "実行中の別の契約が触るファイルに触れていない"
    - "起票者の手順書に同じ趣旨の記述があれば直すべき箇所として挙げている"
    - "禁止語と秘匿の検査を送出物に当て、検査が値を出力していない"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "規約の文書を変える必要がある場合"
    - "検査の道具そのものを変える必要がある場合"
    - "外すと他の検査まで止まる場合"
    - "実行中の別の契約と同じファイルに触れる必要がある場合"
