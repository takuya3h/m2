deviations:
  - type: environment
    note: >-
      prereg の既定 batch 64 が装置に収まらなかった（47.4 GiB で batch 64 と 32 が OOM、収まる最大は 16）。
      利用者に諮り batch 16 + 勾配累積 4 で実効 batch 64 を保った（2026-09-23）。対称性の表の
      「実効 batch 64」は書き換えずに済むが、BatchNorm の統計だけは 16 枚単位になる。解像度を下げる案は
      SPEC の指示どおり出していない。
  - type: judgement
    note: >-
      prereg の「一本が 3 時間以内」を 28 本中 12 本が超えた。上限 36 epoch を変えずに続行する判断を
      利用者から得ている（2026-09-23）。G2 の一本目自体は 2.36 時間で条件を満たした。上限への張り付きは
      0 件で、打ち切りが全 run で働いたため、上限を下げていれば収束前に切っていた可能性がある。
  - type: judgement
    note: >-
      学習率の低下と打ち切りの規則が学習ループに直書きで単体試験できなかったため、純関数 plateau_action に
      抽出し、Task B を 2 epoch の時点で止めて最初からやり直した。作業木の内容と実際に回った内容を
      一致させるため。未完了の run stage1_ptower_r3_001 が metrics.json 空のまま残る。
  - type: judgement
    note: >-
      SPEC の Task C-2 と prereg §8 の停止条件（各 run が二周目の同じ折りを下回れば停止）が掃引の駆動に
      入っておらず実行者の目視に頼っていたため、純関数 below_round_two として機械に持たせ、掃引を 35 分の
      時点で止めて作り直した。未完了の run が 2 件（_003_ と _004_）残る。基準は二周目の同じ折りの最良 run
      という厳しい側の読みを取った。
  - type: spec_defect
    note: >-
      prereg §6-1 は主指標と co-primary が同方向であることを前提に書かれ、食い違った場合を定めていない。
      ImageNet 系統で実際に食い違い（J 0.4785 > 0.4757 だが acc 0.7781 < 0.7858）、共有の select() が停止した。
      SPEC の Task E-1 に従って諮り、食い違いを記録したうえで同点規則へ進める判断を得た（2026-09-25）。
      差は折り A の seed 間 SD 0.0294 の内側で、§6-2 の「受容野の短い方」を当てても同じ行になる。
  - type: environment
    note: >-
      Task A-1 と A-7 の spec.yaml の差し替えが、実行者の操作でも本ホストの keeper でもない reset と
      phase0 への往復（reflog に記録）によって失われ、占位のまま commit していた。Task F の P4 FAIL で
      気づき差し替え直した。全 run が記録した contract_sha256 は差し替え前の b7d070f5… で揃っており
      run どうしの整合は保たれているが、最終の spec.yaml とは食い違う。実行者の落ち度は差し替えが
      commit に入ったことを再確認しなかった点である。

issuer_defects:
  - type: asserted_without_measuring
    note: >-
      SPEC §2 と inputs.code.entrypoints が二周目の道具を train_phase_tower_r50.py / run_stage1_ptower.py /
      select_stage1_ptower.py と書くが、これらは一周目のものである。指示どおり train_phase_tower_r50.py を
      改修すると、二周目が実際に使った stage1_ptower_r2.py 系とは別の経路を直すことになり、掃引も選定も
      動かない。実物を読んで stage1_ptower_r3.py を新設し、二周目の道具は再現性のため変更しなかった。
  - type: self_contradiction
    note: >-
      outputs.expected_runs は 308 だが、これは fine-tune 28 と時間ヘッド 280 の和で、SPEC の Task D-1 が
      求める特徴抽出 28 本を数えていない。指示どおり掃引を実装すると run は 336 になり、expected_runs と
      一致しない。完了判定 j を行数の一致で読むと必ず外れるため、task_id で照合する読みを採った。
  - type: asserted_without_measuring
    note: >-
      prereg §2 が既定として置く batch 64 は装置に収まらない（47.4 GiB で batch 64 も 32 も OOM）。
      起票時に記憶領域が測られていない。指示どおり batch 64 で起動すると一本目が即座に OOM で落ちる。
      SPEC §2 が「所要時間と記憶領域は Task B で実測する」と書くため停止条件としては想定内だが、
      既定値そのものが実行不能である点は残る。
  - type: asserted_without_measuring
    note: >-
      SPEC §2 と prereg §3 が腕1 を「T-2026-09-19-stage1-detector-towers-r2 の処方」と呼ぶが、その契約は
      存在しない。指示どおり参照しようとすると tasks/ に無く解決できない。実在するのは
      tasks/T-2026-09-18-stage1-detector-towers で、参照先の中身（COCO 初期化の checkpoint）は一致していた
      ため、そちらの記録を照合に使った。
  - type: asserted_without_measuring
    note: >-
      SPEC §2 は「追加 6 動画（17〜22）の注釈は ilya に在る」と書くが、画像の有無は測られていない。
      実測すると注釈は在るが画像が 0 件で、指示どおり P*-21 を学習しようとしても入力が無い。
      SPEC §6 の想定どおり P*-21 は UNKNOWN とした。注釈の所在だけを確かめて画像を確かめなかった誤り。
  - type: rule_read_narrowly
    note: >-
      prereg §6-1 の判定規則は主指標と co-primary が同方向であることを前提に書かれ、食い違った場合を
      定めていない。ImageNet 系統で実際に食い違い、一周目から共有している select() が ValueError で停止した。
      指示どおり規則を当てるだけでは系統が確定せず、諮るまで Task E が進まない。§6-2 の「受容野の短い方」の
      段が実装に無いことも併せて分かった（この事例では同じ行になるため結果は変わらない）。

