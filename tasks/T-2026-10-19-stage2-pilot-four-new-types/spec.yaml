intent:
  question: "利用者が送った界面の提案カードのうち四つの型（工程から検出の decoder-xattn と extra-queries、検出から工程の logit-correction と tool-history）を、前回と直しの契約と同じ条件（折り A、seed は一つ、学習の長さを固定、六つの腕）で回すと、空の腕との差と入れ替えの腕との差はどうなるか。非公式の測定であり、関門の判定にも設計の判断（型の採否を含む）にも使わない"
  decision_at_stake: "進捗報告の材料と、四つの型が今ある塔の上で動くことの実証。カードの批判会話と利用者の判定の参考の値として並べるが、結果で型の採否を決めない"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery の動画 01 から 15 のうち、折り A の train と val の動画（conventions#folds）。前回と直しの契約と同じフレーム集合（術具と工程の両方の注釈があるもの）。折り A の test の動画のフレームは信号の作成と学習と評価に通さない"
    split_files: ["data/splits/ego_train.txt", "data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints: ["scripts/stage2pilot/pd_model.py", "scripts/stage2pilot/dp_model.py", "scripts/stage2pilot/dp_train.py", "scripts/stage2pilot/run_pd_fix.sh", "scripts/stage2pilot/run_dp_fix.sh", "scripts/stage2pilot/shuffle_signals.py", "scripts/stage2pilot/aggregate_fix.py", "scripts/stage2pilot/extract_det_signals.py", "scripts/stage2pilot/det_metrics.py", "scripts/stage2pilot/common.py", "scripts/stage2pilot/test_audit_fix.py", "scripts/train_t1b.py"]
contract:
  inject_verbatim: [conventions#prohibitions, conventions#issuer_cautions, conventions#env_p0, conventions#folds, conventions#split, conventions#eval_recipe, conventions#det_groups]
  conventions_rev: "5c0eaeeb4551c66c9b854faaa7a5376dcf755ac7"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values, no_runindex_hand_edit]
  verbatim_forbidden: true
  allow_write: ["experiments/analysis/stage2_pilot_four", "experiments/phase1/stage2four", "runindex/"]
plan:
  phases:
    - {id: A, name: "開始状態。分岐、起点、直しの契約の道具が phase0 に在ること、未追跡の退避、task-start が置いた抑止の目印の確認、両ホストの装置の他プロセス、記憶領域、試験の失敗の名前", gpu: false, est: "1h"}
    - {id: B, name: "材料の確認と再現。前回と直しの契約の信号の要約値を確かめ、塔単独の val を andrew で再現する", gpu: true, est: "1h"}
    - {id: C, name: "実装と恒等性。五つの界面（四つの型とゲートなし版）、x の組み立て、見落としの集合を作り、既定の挙動が変わらないことと学習前の一致と陽性対照を確かめる", gpu: true, est: "8h"}
    - {id: D, name: "殺し実験（記述だけ）。見落としの数え上げと神託、多項ロジスティック回帰、検出の系列だけの GRU", gpu: true, est: "2h"}
    - {id: E, name: "学習。検出から工程の 18 本を andrew で、工程から検出の 12 本を型ごとに一つのホスト（andrew か bengio）で回す", gpu: true, est: "16h"}
    - {id: F, name: "集計、検証、報告", gpu: false, est: "3h"}
  gates:
    - {id: G1, after: A, check: "分岐が feat/ で始まり起点が origin/phase0 で、phase0 に直しの契約の固定の長さと入れ替えの道具が在り、andrew に本契約以外の compute プロセスが無く、記憶領域と試験の失敗の名前を記録した", on_fail: stop}
    - {id: G2, after: B, check: "前回と直しの契約の信号の要約値が記録と一致し、塔単独の val が前回の値と許容差の中で再現した", on_fail: ask}
    - {id: G3, after: C, check: "五つの界面のすべての腕で学習前の出力が塔単独と一致し、陽性対照で出力が変わり、extra-queries の元の query の出力が界面によらず塔単独と同じで、既定の経路が直しの契約の集計を同じ値で再現し、test の動画のフレームを通していない", on_fail: stop}
  env:
    venv: ".venv"
    preflight: [venv_active]
  resources: {server: bengio, gpu: 4, est_hours: 31, runs: 31}
outputs:
  must_have: [REPORT.md, RESULT.md, result.yaml, audit.md]
  destination: "experiments/analysis/stage2_pilot_four/"
  acceptance:
    - "a: 開始状態として、分岐、起点、phase0 に直しの契約の道具が在ること、未追跡の退避、andrew と bengio の装置の compute プロセスの一覧、記憶領域の空き、試験の失敗の名前が記録されている"
    - "b: 前回と直しの契約の信号（入れ替えた信号を含む）の在否と要約値が記録され、記録と一致している"
    - "c: 工程塔と検出塔の塔単独の val が andrew で再現され、工程から検出の型を bengio で回すときは検出塔の塔単独の val が bengio でも再現され、差が SPEC の許容差の中にあるか、超えて停止した記録がある"
    - "d: 五つの界面が SPEC の定義のとおりに実装され、学習するパラメータの名前の集合が界面のパラメータの全部でありそれ以外を含まないことが記録されている。既存の型と既定の経路の挙動は変わらない"
    - "e: 五つの界面の全腕で学習前の出力が塔単独と一致し、ゲートか最後の層を零でない値にすると出力が変わる。extra-queries では、界面の重みを変えても元の query の出力が塔単独と同じで、mask を外すと変わる"
    - "f: extra-queries の見落としの集合が SPEC の読み（字面どおり）で train から一度だけ作られ、box の数、クラスごとの数、確信度の閾値ごとの数が記録されている"
    - "g: 殺し実験の三つ（見落としの数え上げと神託、多項ロジスティック回帰、検出の系列だけの GRU と stacking）の値が記録され、測れなかったものは理由つきで UNKNOWN と書かれている"
    - "h: SPEC の run の表のすべての run が固定の長さで回り、一つの型の全腕が同じホストで回ったことが記録されている。測れなかった run は理由つきで UNKNOWN と書かれている"
    - "i: ゲートを持つ型（decoder-xattn の層ごと、tool-history）のゲートの値が epoch ごとに記録され、extra-queries の追加の出力の寄与が記録されている"
    - "j: 型ごと・腕ごとに、四つ目の epoch の値、空の腕との差、入れ替えの腕との差、動画ごとの差が表にあり、SPEC の読み方の規則で記述されている"
    - "k: 検出から工程の全腕と、工程から検出の型ごとの中間記録が分岐へ push されている"
    - "l: test の動画のフレームを信号の作成と学習と評価に一度も通していないことが、通した動画の集合で示されている"
    - "m: 前回と直しの契約の run の置き場・集計・保存先、data の raw と external、凍結源、既存の checkpoint、third_party に書き込んでいない。試験の失敗が増えていない"
    - "n: PR が Draft でなく存在し、base が phase0、分岐が feat/stage2-pilot-four-new-types"
  report_to: [notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "andrew か bengio に本契約以外の compute プロセスがある場合（止めずに利用者に諮る）"
    - "直しの契約が終わっていないか、その PR が phase0 に統合されておらず、固定の長さと入れ替えの道具が phase0 に無い場合"
    - "前回か直しの契約の信号が無い、または要約値が記録と食い違う場合"
    - "塔単独の val が前回の値と許容差を超えて食い違う場合"
    - "SPEC の型の定義が受け取り手の実装と合わず、意味を変えないと実装できない場合"
    - "extra-queries の学習前の上位の検出が塔単独と一致しない場合（スコアのずらしの初期値を変えずに諮る）"
    - "既存スクリプトの既定の挙動を変えないと実装できない場合"
    - "記憶領域が足りない場合"
    - "実行基盤が書き込み、移動、削除を拒む場合"
