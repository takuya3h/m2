issuer_defects:
  - type: check_does_not_check
    note: >-
      Task 2 Step 2 が sh -n による構文検査を指示し「両方が零であること。構文誤りのまま
      起動すると常駐処理が即座に落ちる」と書くが、両スクリプトの shebang は #!/bin/bash で
      /bin/sh は dash への繋がりである。m2-sync.sh 75 行はプロセス置換 <(...) を使っており
      dash では構文誤りになる。指示どおり実行すると
      「/home/ubuntu/bin/m2-sync.sh: 75: Syntax error: "(" unexpected」が出て m2sync_syntax=2 となり、
      正常なスクリプトに対して「両方が零」を満たせず Task 2 Step 2 で停止する。
      実行時に使われるのは shebang の /bin/bash であるため、この検査は起動時に落ちるかを
      検査していない。bash -n で測り直すと両方 0 だった。
  - type: self_contradiction
    note: >-
      Goal の表が「同期処理の監視、除外規則の反映、版管理の同期」を三十九から五十行とし
      「これを動かす」と指示するが、その範囲の 41-43 行は監視ではなく起動である
      （keeper.sh 6 行の役割説明も「syncthing の起動・死活監視」と書いている）。
      一方で禁止 2 は「同期処理を起動する」を禁じ、判定 11 と G2 は「同期処理が零件」を求める。
      同じ契約が同じ行を動かせと指示し、その行がすることを禁じている。
      lecun では test -x が TRUE、pgrep -x syncthing が未稼働で両方の条件が成立するため、
      指示どおり無改変で起動すると syncthing が起動し禁止 2 に触れ、判定 11 と G2 を満たせない。
      ~/bin/syncthing は前契約 T-2026-08-22-lecun-node-foundation が置いたものであり、
      前契約は五台すべてに配置しているため全台で起きると見込まれる。

