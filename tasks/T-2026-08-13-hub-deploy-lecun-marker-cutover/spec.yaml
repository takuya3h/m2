  kind: impl
  title: "lecun の旧 marker を可逆退避し、正本 keeper を marker 無しで起動して中心化する"
  origin: human
  created_at: "2026-08-13T09:47:45Z"
  created_from:
    runindex_commit: "f96edc1"
