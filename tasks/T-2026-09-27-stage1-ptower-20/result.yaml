deviations:
  - type: judgement
    note: >-
      Task C（ホスト差の対照）は fine-tune → 特徴 → 時間ヘッドの順にしか進められず GPU 1 枚しか使わないため、
      利用者の了承を得て G2 の判定前に Task D の一本目（P*-20・COCO・折り A・seed 42）を GPU 1 で始めた（2026-10-02）。
      契約の phases は C→D の順。
  - type: judgement
    note: >-
      G2 は不合格（+0.0696、閾値 0.0372）。on_fail: ask に従い諮り、利用者が「差を記録して続行」を選んだ（2026-10-03）。
      P*-20（efros）と P*-15（ilya）の並置にはホスト差が混ざる。同一ホストの唯一の点（COCO・折り A・seed 42）では
      P*-20 0.7461 が efros の P*-15 0.7762 を下回る。
  - type: judgement
    note: >-
      P*-20 の fine-tune は見込み 9 時間で契約の 8 時間を超えるため諮り、recipe を変えずに続行する承認を得た（2026-10-03）。
      実測で 8 時間を超えたのは 14 本中 2 本（COCO 折り C 8.56 時間、ImageNet 折り E 8.11 時間）。合計 90.0 GPU 時間。
  - type: environment
    note: >-
      efros の cgroup 上限 52 GiB で 2 本を並べると、PyTorch 2.1 の pinned メモリのキャッシュが 1 回の val で
      256 MiB × 約 95 塊（約 24 GiB）まで積もり、OOM killer が 2 本とも止めた（oom_kill 3）。P*-20 の設定だけ
      pin_memory=False にした（logits の要約値は一致）。ホスト差の対照は起動時の設定のまま pin_memory 既定 True で走った。
      三周目のスクリプトは cfg.get("pin_memory", True) で既定を変えていない。
  - type: environment
    note: >-
      未完了の run が 5 件残る（metrics.json が空で再開判定は完了と見なさない）。_001_ は対照で、実行者が Bash の
      run_in_background で起こしたため 30 分の上限で子プロセスごと止まった。_002_ は P*-20 で動画 19 の切れた画像に当たった。
      _003_（対照）と _004_（P*-20）は OOM。_006_ は P*-20 で、pinned メモリが積もり次の epoch 境界で OOM になる恐れがあったため
      実行者が止めた。失敗したログは消さず .failed1〜.failed3 を付けて退避した。
  - type: judgement
    note: >-
      掃引の駆動を対ごとの投入から GPU ごとの待ち行列に変え、走行中の同一設定と使用中の GPU を避けるようにした。
      所要時間が 4.1〜8.6 時間と run ごとに違い、対では GPU が遊ぶため。特徴抽出と時間ヘッドの 13 本は、最後の fine-tune を
