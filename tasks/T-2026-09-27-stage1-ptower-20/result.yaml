    P*-20 と P*-15 の差（val: COCO +0.0454、ImageNet +0.1214。test: COCO +0.1226、ImageNet +0.1222）は efros と ilya をまたぐ比較で、
    G2 のホスト差（+0.0696、SD 比 3.7）と同じ大きさである。唯一の同一ホストの点では P*-20 が P*-15 を 0.0301 下回る。
    データ量の効果を主張するには、P*-15 を efros で 14 本回して同一ホストで比べる必要がある（2 枚で約 31 時間）。
  - >-
    工程塔の送り手の train と val の差は 4 塔 × 5 折りの 20 件すべてで閾値 3pt を超えた（最小 +0.1254、系統と設定ごとの平均
    +0.2521 / +0.2510 / +0.3968 / +0.3449）。conventions#crossfit に従い、Stage 2 の P→D 側の工程塔の送り手にも交差適合を適用する対象である。
  - >-
    efros の cgroup 上限は 52 GiB。PyTorch 2.1 の pinned メモリのキャッシュは塊を返さず 1 回の val で約 24 GiB まで積もりうるため、
    efros で 2 本並べる GPU 学習は pin_memory=False を既定にするか、上限を確認してから並べる。
  - >-
    efros の A6000 は短辺 800・batch 16 で 14.2 フレーム/秒（ilya の約 0.68 倍）。P*-20 の fine-tune は 4.06〜8.56 時間、合計 90.0 GPU 時間。

