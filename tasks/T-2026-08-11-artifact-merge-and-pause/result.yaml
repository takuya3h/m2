    note: >-
      使い捨ての分岐 2 本を隔離した作業ツリーに作り、生成物の衝突を再現した（投影 2 件と
      集約結果 1 件が衝突・merge exit 1）。方式ごとに 3 基準を実測した。既定のままは衝突。
      union は衝突 0・再生成後に taskindex-check と inbox-check がともに exit 0・組み込みで
      各ホストの設定が不要。ours は設定が無いと属性が黙って無効になり衝突する（exit 1）。
      3 基準すべてを満たす union を採り、設定を置いた状態で同じ再現をやり直して
      衝突 0 件を確かめた。
  - id: G2
