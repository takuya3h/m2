issuer_defects:
  - type: check_does_not_check
    note: >-
      Task 1 Step 2 の生成物一覧の取り方（grep -n "NAME = \|_NAME\b" を 3 生成器へ）は 9 件を
      返すがすべて build_taskindex.py からで、build_inbox.py と build_context.py は 0 件である。
      指示どおり一覧を作ると生成物 8 件のうち 3 件しか拾えず、tasks/inbox.md と build_context
      由来の 4 件が漏れる。Phase B Step 1 が「Task 1 Step 2 と同じ取り方にする」と指示している
      ため、誤りがそのまま検査器の除外一覧へ伝播し、生成物が違反として検出されることになる。
  - type: check_does_not_check
    note: >-
      Task 3 Step 3 は「make taskindex && python tools/check_forbidden.py で生成物だけの差分では
      0」を期待するが、清潔な作業ツリーでは生成器が差分を作らないため excluded=0 のまま exit 0 に
      なる。指示どおり実行しても除外が効いていることを一切示せない空振りの検査である。実際に
      実行したところ生成器は差分を作らず、起点を HEAD~1 に変えて初めて除外の発火を測れた。
  - type: asserted_without_measuring
    note: >-
      Task 3 Step 5 は script_exit と make_exit について「両方を記録する。値が異なることを
      前提とする」と書くが、実測ではどちらも 0 で標準出力もバイト一致だった。差が出る根拠は
      示されていない。指示どおり「異なる」を前提に読むと、同一であることを異常と誤読しかねない。

