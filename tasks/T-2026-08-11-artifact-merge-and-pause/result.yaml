    note: >-
      除外の側は起点を HEAD~1 にして実在の生成物差分で測り、changed=23 / excluded=4 /
      checked=19 / exit 0 を得た。除外された 4 件の内訳も出力される。違反の側は
      context/conventions.md へ 1 行足して exit 1 と違反の明示を得て、git checkout -- で
      戻し git status が空であることを確かめた。起点が誤っている場合は exit 2 で通さない。
