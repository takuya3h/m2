    observed: "prereg commit は 2026-08-29T13:52:50+00:00、最早の run の config.yaml は 13:53:21 で 31 秒後。12 run すべてが後である。ただし所要時間の試走は commit 前に走っており、--no-evidence のため run としては残っていない"

