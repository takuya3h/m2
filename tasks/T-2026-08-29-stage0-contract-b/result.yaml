    breaking_input: "mask が次元を落としていれば空段の入力次元は 2063 より小さくなるはず"
    observed: "空段の入力次元は 2063 のままで tool 部は全 0 だった（非零率 0.0000）。予測段 0.9862 / 正解段 0.1553 / 正解⊕予測段 0.5708 と対照的である"
