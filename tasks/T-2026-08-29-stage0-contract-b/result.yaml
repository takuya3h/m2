    observed: "陽性（収穫前 vs 収穫後）は index.csv で 追加 12 / 削除 0 / 変更 0。追加集合は本契約の 12 run と完全一致し混入 0。先契約 k1-reeval-and-harvest では同じ器が集約表で変更 8 件を検出しており、常に 0 を返す壊れ方ではない"
  - judgement: "凍結源の照合が働いていること（判定 f）"
    breaking_input: "ckpt が変わっていれば sha256 が正本と食い違うはず"
    observed: "作業前後とも 03936318f9d45ac956fa928278cff9a869d3c2583e86b3af3ac1bbd27675e824 で conventions#frozen_source の正本と一致。先契約で同型の照合器に 1 バイト加工を与えたときは不一致になることを実測済み"
  - judgement: "prereg の時系列（判定 b）"
