spec_version: 1

meta:
  task_id: "T-2026-08-08-session-durability"
  kind: impl
  title: "対話の記録を不揮発化し、実装系をまたいで後から検索できるようにする"
  origin: claude-app
  created_at: "2026-08-08T16:00:00Z"
  created_from:
    runindex_commit: "12cc0e8"
    counts: {index: 749, experiments: 206, verdicts: 1038}
  depends_on: ["T-2026-08-08-stdin-intake-and-anchor-cleanup"]
  amendments: []

intent:
  question: "対話で積み上がった判断を、実装系をまたいで後から辿れる形へ残せるか"
  decision_at_stake: "議論の記録を仕組みへ移すか、失われ続けるのを受け入れるか"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints: ["tools/fetch_task.py"]

contract:
  inject_verbatim: [conventions#prohibitions, conventions#naming]
  conventions_rev: "d422b08"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_runindex_hand_edit, no_estimated_values]
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "受け皿の規約と機械抽出の実装", gpu: false, est: "70m"}
    - {id: B, name: "第一の実装系での自動化", gpu: false, est: "50m"}
    - {id: C, name: "第二の実装系での自動化と記録の訂正", gpu: false, est: "60m"}
  gates:
    - id: G1
      after: A
      check: "抽出器が秘匿情報を伏せることを、含む入力と含まない入力の双方で確認した"
      on_fail: stop
    - id: G2
      after: B
      check: "セッション終了で記録が生成されることを実際に終了させて確認した"
      on_fail: stop
    - id: G3
      after: C
      check: "第二の実装系でも記録が生成されることを確認した"
      on_fail: ask
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "docs/sessions/"
  acceptance:
    - "抽出器が対話記録から機械的な要素だけを取り出す"
    - "抽出器が秘匿情報を伏せ字にする"
    - "抽出結果に自由記述の要約が含まれない"
    - "第一の実装系でセッション終了時に記録が生成される"
    - "第二の実装系でも記録が生成されるか、生成できない理由が記録されている"
    - "受け皿の様式と運用規約が文書化されている"
    - "生の対話記録が版管理へ入らない"
    - "make task-validate が exit 0"
    - "make task-preflight が exit 0"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: [secret_leaked_into_digest, raw_transcript_staged]
