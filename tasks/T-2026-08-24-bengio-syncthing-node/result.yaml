issuer_defects:
  - type: self_contradiction
    note: >-
      禁止 1 の但し書きは「中継は中心へ SSH で入る操作だが、中心の状態は変えない。中心で命令を
      実行してはならない」と定めるが、Task 1 Step 6 は ssh … 192.168.196.150 'echo REACHABLE' を
      指示する。これは中心での命令の実行そのものである。到達確認だけなら命令を伴わない ssh -N で足りる。
      本契約では ssh -N を採った。
  - type: check_does_not_check
    note: >-
      Task 1 Step 3 は grep -o 'apikey>[^<]*' … | head -1 | cut -c1-12 を指示し「値が出れば、そのまま
      置いてはならない」と続けるが、この命令自体が秘匿の実値の先頭 12 文字を画面へ出す。禁止 7 と
      申し送りの「画面の鍵に注意」の意図に反する。存在の確認は長さと空判定で足りる。
  - type: shell_assumption
    note: >-
      P9 spec_lint が separated_source を 5 件返した（SPEC.md:50,473,476,479,507）。いずれも
      source .venv/bin/activate \ で行を継続する形である。字下げ区画を 1 行ずつ別のシェルへ渡す
      実装系では単独の source が壊れた命令になり、続く make が仮想環境なしで走る。
      終了コードは変わらずプリフライトは exit 0 だった。
  - type: asserted_without_measuring
    note: >-
      SPEC Task 5 Step 1 は「repo は約十九ギガあり、初回の同期に時間がかかる」と断定するが、
      bengio の実測は du -sh で 51G、syncthing の global で 40743989547 B（約 40.74 GB）である。
      桁は違わないが倍以上外れており、同期の見込みを誤らせる。
  - type: check_does_not_check
    note: >-
      Task 3 Step 5 は「使わない共有フォルダ（default）があれば消す」と名前で指定する。しかし
      <defaults> 配下には id="" path="~" の folder ひな型があり、名前が一致しないため残る。
      ひな型は同期対象ではないので実害は無いが、名前による確認では id="" の要素が残っていることに
      気づけない。実際に利用者がこれを共有対象と誤認して削除した。確認は名前ではなく最上位の
      <folder> の列挙で行うべきである。
  - type: asserted_without_measuring
    note: >-
      SPEC Task 5 Step 2 は「開始時は八キロバイト・一件だった。増えていれば届いている」と断定するが、
      八キロバイトは前契約が philip 上で測った du -sh の丸めた表示である。bengio の実測は 4031 B / 1 件で、
      du -sh はこれを 8.0K と表示する。丸めた表示を実数として引き継いでおり、増減の判定には使えない。
      本契約では du -sb で 4031 B から 9702 B への増加として測った。

