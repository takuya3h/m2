    note: >-
      禁止 1 の但し書きは「中継は中心へ SSH で入る操作だが、中心の状態は変えない。中心で命令を
      実行してはならない」と定めるが、Task 1 Step 6 は ssh … 192.168.196.150 'echo REACHABLE' を
      指示する。これは中心での命令の実行そのものである。状態は変えないため実害は無いが、
      指示どおり実行すると自らの禁止事項に触れる。到達確認だけなら命令を伴わない形が要る。
