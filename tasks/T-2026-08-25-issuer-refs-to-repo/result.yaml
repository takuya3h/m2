issuer_defects:
  - type: asserted_without_measuring
    note: >-
      SPEC が「バンドルには五つのファイルが入っている」と断定したが、tools/fetch_task.py:52 の
      ALLOWED_FILES は spec.yaml / SPEC.md / prereg.md の 3 種のみで、それ以外を含むバンドルは
      BundleError で拒否される。5 ファイルのバンドルは構造上存在し得ない。指示どおり実行すると、
      本命である issuer-cautions.md がホストのどこにも無く、Task 2 Step 2 で実行が止まった。
      利用者へ提示して本文を手渡しで受け取るまで進めなかった。
  - type: check_does_not_check
    note: >-
      配られた issuer-cautions.md のアンカーが <a id="issuer-cautions"></a> とハイフン形で、
      _ANCHOR_RE の [a-z0-9_] に一致しない。SPEC の指示どおり本文をそのまま末尾へ追記すると、
      アンカー行はファイルに在るのに conventions_anchors() の集合には入らず、節の数は 7 のままで、
      追記したのに参照できない状態になる。実測で確認した（issuer-cautions/issuer_cautions とも False）。
      L1 の様式 ^conventions#[a-z0-9_]+ も同じ形を弾く。実行者が issuer_cautions へ直した。
  - type: self_contradiction
    note: >-
      SPEC 禁止 1 は conventions.md の既存の節を変更してはならないと定めるが、
      context/conventions.md:7 は「改訂したら末尾の変更履歴に追記すること」と定める。
      変更履歴はアンカーを持たず naming 節の本文の内側にあるため、行を足すと naming の
      解決結果が変わる。指示どおり両方に従うと必ず一方を破る。禁止 1 を優先して追記しなかった。
  - type: check_does_not_check
    note: >-
      完了判定 G「既存の節が一行も変わっていない」を git diff で測ると節の不変性を測れない。
      追加時に空行を 1 つ挟んだところ naming 節の解決本文が 526 B 23 改行から 527 B 24 改行へ
      変わったが、git diff の削除行数は 0 のままだった。切り出しがアンカーから次のアンカーまでで、
      naming が EOF まで伸びているためである。行の差分ではなく節ごとの要約値で測る必要がある。
      実行者は一度これを踏み、revert して空行を挟まずに追加し直した。
  - type: asserted_without_measuring
    note: >-
      配られた env-facts.md:87 が「Codex 側の .codex/skills/task は ~/claude-sync/codex/ 経由の
      symlink。保守で失われた」と断定したが、実測では版管理下の symlink（commit 19341085、
      target ../../.claude/skills/task）で解決でき、失われていない。~/claude-sync/codex/ のほうが
      存在しない。指示どおり配置すると誤った環境認識が版管理へ入り、以後の契約が引き写す。
  - type: self_contradiction
    note: >-
      SPEC 禁止 4 は生成物の再生成を禁じるが、手順書 SKILL.md §6 は make taskindex と make inbox を
      回して投影に現れることを確かめよと求め、tasks/inbox.d/ への記入も要求する。指示どおり両方に
      従うと禁止 4 を破る。契約を優先し、投影を更新していない。次の実行者が make inbox-check を
      回すと差分が出る。

