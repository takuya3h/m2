      前提の手順に make task-start を置いたが、配布台帳の当該行は本文 0 文字・添付
      なし・sha256 列も空だった。契約を台帳へ載せたことを確かめていない。指示どおり
      実行すると「要約値の列が空です: T-2026-09-17-philip-accept-efros。照合できない
      本文は取り込みません」で make が exit 4 になり、作った分岐が巻き戻されて Phase A
      へ進めない。分岐を手で作る逸脱が必要になった。
  - type: self_contradiction
    note: >-
      SPEC:30 の見出しが「既存の実測（再測定は不要）」として受け入れ一覧 5 件・権限
      600 などを与えているのに、Task 1 Step 1（SPEC:104-109）と完了判定 A が同じ項目
      （場所・行数・要約値・権限・更新時刻・指紋の一覧）の測定を必須にしている。
      指示どおり実行すると結局すべて測ることになり、「再測定は不要」の宣言が働かない。
      実測はすべて表の値と一致したため害は出なかったが、どちらに従うかが決まらない。

