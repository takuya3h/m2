spec_version: 1

meta:
  task_id: "T-2026-09-17-philip-accept-efros"
  kind: impl
  title: "復帰するホストの公開鍵と識別子を中心へ登録し、既存の接続を保つ"
  origin: claude-app
  created_at: "2026-09-17T06:00:00Z"
  created_from:
    runindex_commit: "ee53e58"
    counts: {index: 751, experiments: 207, verdicts: 1038}
  depends_on: ["T-2026-09-17-efros-rejoin-foundation"]
  amendments: []

intent:
  question: "群れへ戻るホストが基盤を整え、公開鍵と識別子を版管理へ公開した。中心の側で二つを登録できるか。受け入れ一覧は既存の五件を失わずに追記でき、同期処理の設定は稼働したまま相手を足せるか。書き換えが起動時の読み込みで上書きされないか"
  decision_at_stake: "復帰するホストが中心へ入れるようになるか。受け入れ一覧を壊せば現在入れている四台も入れなくなる。同期処理を止めれば四ノードとの接続が切れる。どちらも避けながら登録する手段があるかを確かめる"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints:
      - "scripts/sync/keeper.sh"
      - "scripts/sync/m2-sync.sh"

contract:
  inject_verbatim: [conventions#prohibitions, conventions#issuer_cautions]
  conventions_rev: "e7a5100"
  prohibitions:
    - no_split_redefine
    - no_raw_write
    - no_frozen_change
    - no_runindex_hand_edit
    - no_estimated_values
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "現状の測定と控えの保存、反映の手段の確認", gpu: false, est: "50m"}
    - {id: B, name: "追記するものの照合", gpu: false, est: "30m"}
    - {id: C, name: "受け入れ一覧への追記と、同期処理への登録", gpu: false, est: "50m"}
    - {id: D, name: "報告と送出", gpu: false, est: "30m"}
  gates:
    - id: G1
      after: A
      check: "受け入れ一覧と同期処理の設定を測り、相手の実体をひな型と区別して数えた。控えを版管理の外へ取り原本と一致した。稼働中に設定を変える手段と、書き換えが上書きされない条件を確定した"
      on_fail: ask
    - id: G2
      after: B
      check: "提出物が版管理にあることを確かめ、指紋を前契約の報告と照合した。公開鍵だけであることを三つの検査と囮で示し、既に登録されていないことを陽性対照つきで確かめた"
      on_fail: stop
    - id: G3
      after: C
      check: "受け入れ一覧の既存がすべて残っていることを集合差で示し、増えた一件の指紋が期待と一致した。同期処理へ相手を登録し、新しい相手が認識され、四ノードとの接続が切れていない"
      on_fail: stop
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "tasks/T-2026-09-17-philip-accept-efros/"
  acceptance:
    - "受け入れ一覧と同期処理の設定を、追記の前に要約値と件数で記録している"
    - "相手の実体をひな型と区別して数えている"
    - "控えを版管理の外へ取り、原本と一致することを示している"
    - "稼働中に設定を変える手段と反映の条件を確定しており、再起動が必要なら判断を仰いでいる"
    - "提出物の指紋を前契約の報告と照合し、公開鍵だけであることを三つの検査と囮で示している"
    - "追記後に既存がすべて残っていることを集合差で示している"
    - "同期処理へ相手を登録し、共有フォルダの定義そのものを変えていない"
    - "新しい相手が認識されたことを、確かめた方法とともに示している"
    - "四ノードとの接続が切れていないことを示している"
    - "疎通が中心からは測れないことを明記し、報告が指定の構成である"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "追記により受け入れ一覧の既存が一件でも失われた場合"
    - "同期処理の設定の書き換えが上書きされ、反映の手段が見つからない場合"
    - "反映に再起動が必要で、四ノードとの接続を切ることになる場合"
    - "四ノードとの接続が切れた場合"
    - "提出物の指紋が前契約の報告と一致しない場合"
