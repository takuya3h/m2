issuer_defects:
  - type: asserted_without_measuring
    note: >-
      SPEC 冒頭の「先に確定していること（再検証しない）」で「hand_tool_seg の生成経路は
      Mouth Gag と Skewer と器具なしフレームを構造的に除外する」と断定した。実測では
      Skewer の除外率は 0.00%（0/343）、器具の箱が 1 つも無いフレームは 460 中 6 枚、
      Mouth Gag は 2.74% で全体基準 2.98% より低い。指示どおり再検証せずに信じていれば、
      交絡源を Skewer と読み違えたまま設計判断に進んでいた。実際の偏りは希少工程にあり
      （irrigation 8.47%・anesthesia 6.81%）、向きが逆である。
  - type: self_contradiction
    note: >-
      SPEC は同じ事実について再検証を禁じる記述と要求する記述を両方持つ。冒頭は 460 フレームの
      構造的除外を「先に確定していること（再検証しない）」に置くが、Phase B Step 4 は
      「実装とデータの両方を読み、実数と内訳を出す」「Skewer と Mouth Gag に偏っているという
      記述が実データで確かめられるかを見る」と再検証を要求する。前者に従えば測らず後者に従えば測る。
      実際に測った結果、前者の記述が誤りだった。後者に従ったため誤りを検出できた。
  - type: shell_assumption
    note: >-
      SPEC Phase A Step 2 の grep コマンドが --include=*.md を引用していない。実行シェルは
      zsh であり、グロブが展開に失敗して no matches found となり 0 件を返す。指示どおり実行し
      件数だけを見ると「領域注釈の監査物が 1 件も無い」と誤読する。SPEC 自身が注意 8 で
      「変数の直後に記号が続く場合は波括弧で囲む。実行シェルは bash ではない」と警告しながら、
      自らのコマンドが同種の罠を踏んでいる。引用して再実行し 25 件を得た。

