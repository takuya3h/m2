    note: "SPEC §4 と escalate_if の「既存行の変更・削除が零件」は集約表には原理的に満たせない。新しい run が既存の experiment 群へ加入すれば、その群の平均・sigma・Delta は必ず再計算される。指示どおり実行すると、正常な収穫で必ず escalate して停止する。実際に停止した"
  - type: check_does_not_check
    note: "SPEC §6 の完了判定 d は投影の検査だけを求めるが、契約が runindex/ への収穫を許可する一方で make forbidden-check は runindex/ を固定の禁止領域として持ち契約ごとの許可を受け取らない。指示どおり収穫すると forbidden-check は必ず exit 2 になる。実測では違反 70 件すべてが runindex/ で experiments/ data/ transfer/ は 0 件だった"
  - type: check_does_not_check
    note: "plan.env.preflight に gpu_free を宣言したが、tools/preflight_task.py の CHECK_NAMES は P1 から P9 の 9 語しか持たず未知の名前を検出する分岐が無い。schema も items type string で任意の文字列を通す。指示どおり preflight を信頼すると、GPU が塞がっていても検査を通過して PASS になる"

