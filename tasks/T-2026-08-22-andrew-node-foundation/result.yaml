issuer_defects:
  - type: self_contradiction
    note: >-
      Task 1 Step 5 は git remote set-url --push だけを実行させたうえで「両方が https に
      なったことを確かめる」と書くが、--push は push 側しか書き換えないため fetch 側が git@ の
      ホストではこの期待を原理的に満たせない。andrew は fetch 側も git@github.com:takuya3h/m2.git
      であり、指示どおり実行しても git remote -v の 2 行のうち 1 行は git@ のまま残る。
  - type: asserted_without_measuring
    note: >-
      Task 3 の Files 欄は scripts/sync/hub_keys/andrew.pub を Create と断定するが、実際には
      初期化前の鍵が版管理に残っており git status は M を返した。指示どおり cp を実行すると
      在ることを知らないまま既存の公開鍵を上書きする。上書き前の値を控える手順が契約に無いため、
      実行者が気付かなければ旧指紋 SHA256:i7+kCZH9... は記録されずに消える。
  - type: asserted_without_measuring
    note: >-
      「前契約で確定した事実（全台で同じはず）」の 2 と 5 が andrew では成立しない。2 の
      ~/.local/share/uv/python/ は存在せず、5 の jsonschema は既に 4.26.0 が入っていた。
      2 のほうが危険で、貼り直す先が無いと分かった実行者が uv venv --clear（禁止 7・6.2G を破棄）
      へ手を伸ばしかねない。契約は「同じ経路が在るかを確かめる」とは書くが、無かった場合に
      どうするかを書いていない。
  - type: shell_assumption
    note: >-
      Task 3 Step 1 の ls -la ~/.ssh/id_ed25519_andrewtophilip* と Task 1 Step 2 の
      ls -la .venv/bin/python* は 2>&1 付きで書かれているが、このホストのログインシェルは zsh で
      既定の nomatch が有効なため、該当が無いとき ls は起動せず (eval):1: no matches found: を
      シェル自身が返す。ls の「無い」という出力とは別物であり、|| echo を付けなければ
      終了状態の解釈を誤る。契約の申し送り 1「無いことと読めないことを区別する」に契約自身が抵触する。

