issuer_defects:
  - type: asserted_without_measuring
    note: >-
      起票者の表は「別の制限（強制アクセス制御）| 該当する項目が存在しない」と断定するが、
      実測では AppArmor が docker-default (enforce) で動いている（自プロセスと init の
      両方、到達できた 3 台すべて）。/sys/kernel/security/apparmor は容器内で securityfs が
      未マウントのため不在であり、そこを見て「無い」と結論したと読める。
      /proc/self/attr/current を読めば分かる。さらに
      /proc/sys/kernel/unprivileged_userns_apparmor_policy が実在する（root 専用で
      読めないため sysctl -a に現れない）。指示どおり「MAC は無い」を前提にすると、
      原因の候補から AppArmor が落ち、seccomp だけを疑うことになる。
  - type: asserted_without_measuring
    note: >-
      起票者の表は「実装系の版 | 3 台で 3 つの版（0.144 / 0.146 / 0.147）」と断定するが、
      到達できた 3 台の package.json を直接読むと **すべて 0.147.0** である。
      codex --version が失敗するのは版の違いではなく、非対話ログインで nvm が初期化されず
      PATH に入らないためである（nvm の既定 node は 3 台とも 20 と設定されている）。
      指示どおり「3 版ある」を前提にすると、存在しないばらつきを直そうとする。
      0.144 と 0.146 の出所は本契約では検証できない（到達できた 3 台には無い）。
  - type: check_does_not_check
    note: >-
      Task 3 Step 1 の repo 側の探し方が名前を 5 個（efros lecun ilya philip dlsta）に
      決め打ちしている。正本である syncthing の device は 11 台であり、
      **bengio を含む 6 台が漏れる**（adam andrew bengio he hinton ian）。
      bengio は ~/.ssh/config に項目を持ち、鍵で認証が通る 2 台のうちの 1 台であり、
      本契約で最も測定価値が高いホストである。SPEC 自身が注意 5「対象の一覧そのものが
      正しいかを確かめる」と注意 7「同じ探し方の変種を並べない」を書きながら、
      探す語を決め打ちしている。指示どおり repo 側だけを見ると bengio を測らずに終わる。
  - type: shell_assumption
    note: >-
      Task 1 Step 2 の command -v -a bwrap は bash の書式であり、zsh では
      (eval):3: command not found: -v で落ちる。SPEC 自身が「実行環境の対話シェルは
      bash ではない」と警告している。zsh では whence -a を使う。指示どおり実行すると
      「別の実体があるか」を確かめる部分が実行されず、経路の順序も記録できない。
      なお whence -a は PATH の重複により同じ経路を 7 行返すため、重複を畳む必要がある。
  - type: self_contradiction
    note: >-
      Task 5 Step 2 は ps -eo args | grep -i "syncthing\|rsync\|unison" を指示し、
      「プロセスの一覧は ps -eo args から取る。検索コマンド自身に一致する方法を使わない」と
      注意を添えている。しかし同じ SPEC の「前契約で確定した環境の事実」の表が
      「ps -eo args | grep -c は自己一致する。/proc/*/cmdline を読み、自分と祖先を除いて
      数える」と明記している。**指示された方法が、同じ SPEC が確定したとする事実と
      矛盾し、添えられた注意を満たさない。** 指示どおり実行すると同期処理の稼働数を
      誤って数える。/proc 方式で数え直して 2 件（監視親と実働子）を得た。

