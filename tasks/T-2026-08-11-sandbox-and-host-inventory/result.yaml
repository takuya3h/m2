gates:
  - id: G1
    verdict: pass
    note: >-
      隔離の失敗を道具を介さない方法でも測り、環境の側であることを確定した。unshare 命令の
      3 種（user / user+map-root / mount）すべてが Operation not permitted で exit 1。
      python の libc 直接呼び出しでも CLONE_NEWUSER と CLONE_NEWNS の両方が EPERM。
      homebrew の bwrap（0.11.2、権限 555）と第二の実装系に同梱の bwrap（権限 775）の
      両方でも失敗。系の標準の場所（/usr/bin /usr/local/bin）には実体が無い。
      合計 4 経路すべてが失敗し、道具の在処や権限ビットでは説明できない。
      kernel.unprivileged_userns_clone は 1、max_user_namespaces は 255595 で許可されている。
      残る候補は Seccomp（filter モード、1 フィルタ）と AppArmor（docker-default enforce）の
      2 つだが、どちらが効いているかは切り分けられない（後述の unknowns）。
  - id: G2
    verdict: pass
    note: >-
      到達できたホストと到達できなかったホストを列挙した。TCP の 50072 は 10 台中 9 台が
      OPEN で philip のみ No route to host。認証まで通るのは bengio と efros の 2 台のみ
      （設定に項目と鍵があるのがこの 2 台と philip だけ）。到達できた 2 台では 39 行の
      同一の手順書を流し、測り方を変えていない。カーネルが 5.15.0-185 / 6.8.0-136 /
      5.15.0-179 と異なるにもかかわらず名前空間の結果は 3 台とも同一であった。
      残る 8 台は鍵も設定の項目も無く一切測れないため UNKNOWN とした。
  - id: G3
    verdict: pass
    note: >-
      設定の実体がある場所を repo の外まで含めて探し、配布の経路を特定した。
      共有領域 ~/claude-sync は git の作業ツリーではなく（.git 不在）、動いている
      syncthing の 2 プロセスが配布している（設定に folder id=claude-sync
      path=/home/ubuntu/claude-sync type=sendreceive 共有相手 11 台）。rsync と unison は
      0 件。各実装系の設定は共有領域を指す symlink であり、~/.codex に 6 件、~/.claude に
      5 件、~/.agents 自体が 1 件で合計 12 件。張る手順は
      docs/host_dev_env_setup.md:578-587 に文書化されている。ただし実際の張り方は
      文書と一部食い違う（後述）。目印（.stfolder）だけで断定していない。

