      STUN disabled の記録を見つけ、それを判定に使った。issuer_defects に対応する。

issuer_defects:
  - type: check_does_not_check
    note: >-
      Task 2 Step 3 は陽性対照を「変える前の記録に外向きの痕跡が在ったこと」と置き、
      判定を「周期を越えて待ち新たな痕跡が現れないこと」と置いた。しかし中心の STUN の
      痕跡は起動時の 2 件だけで周期的ではなく、通常の水準では keepalive が記録されない。
      指示どおり実行すると、設定を変えなくても新しい行は出ないため「止まった」と
      誤って結論できる。実際の決め手は契約が指していない別の行（STUN disabled、
      無効側の分岐でだけ出る）であり、これを実装から見つけて判定に使った。

