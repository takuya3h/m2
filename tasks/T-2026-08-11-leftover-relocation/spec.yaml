spec_version: 1

meta:
  task_id: "T-2026-08-11-leftover-relocation"
  kind: impl
  title: "実行ホストにのみ残る過去の run を退避し、索引が正本と一致することを示す"
  origin: claude-app
  created_at: "2026-08-11T09:30:00Z"
  created_from:
    runindex_commit: "12cc0e8"
    counts: {index: 749, experiments: 206, verdicts: 1038}
  depends_on: ["T-2026-08-10-branch-naming-and-canonical-index"]
  amendments: []

intent:
  question: "このホストにのみ残る過去の run を退避すると、索引が正本と一致するか"
  decision_at_stake: "退避物を保持したまま運用するか、参照可能な場所へ移すか"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints: ["tools/harvest_runindex.py"]

contract:
  inject_verbatim: [conventions#prohibitions, conventions#naming]
  conventions_rev: "d422b08"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_runindex_hand_edit, no_estimated_values]
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "退避対象の確定と控えの作成", gpu: false, est: "50m"}
    - {id: B, name: "退避と索引の照合", gpu: false, est: "50m"}
    - {id: C, name: "記録と整理", gpu: false, est: "30m"}
  gates:
    - id: G1
      after: A
      check: "退避対象が版管理の追跡下に無いことを一件ずつ確認し、控えを作った"
      on_fail: stop
    - id: G2
      after: B
      check: "退避後の索引が正本と一致することを実測で確認した"
      on_fail: stop
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md, relocation_log.md]
  destination: "tasks/"
  acceptance:
    - "退避対象が追跡下に無いことを一件ずつ確認している"
    - "退避先と元の場所の対応が記録されている"
    - "退避物が失われていない"
    - "退避後の索引が正本と一致する"
    - "追跡下の実験証跡が一件も移動していない"
    - "make task-validate が exit 0"
    - "make task-preflight が exit 0"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: [tracked_artifact_moved, index_mismatch_after_relocation, file_count_mismatch]
