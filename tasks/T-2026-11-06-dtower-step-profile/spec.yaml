  depends_on: [T-2026-11-06-tower-batch-probe, T-2026-10-22-tower-reselect-search-dlsta]
  amendments: []
intent:
  question: "検出塔の学習の一歩のうち、GPU が動いていない時間はどこで生じているか（読み込みの待ち、CPU 側の損失の対応づけ、2 プロセスの同期、カーネルの起動の隙間）。batch・プロセス数・worker 数でそれがどう変わるか。測るだけで、設定の採否は決めない"
  decision_at_stake: "両塔の学び直しの回し直し（andrew）で、検出塔の batch の軸の値と、読み込み・プロセス数の設定をどう置くか（利用者が決める）"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery の折り A の train の動画（conventions#folds）の術具注釈のあるフレーム。数十歩だけ読む。折り A の test の動画のフレームは読まない"
    split_files: ["data/splits/ego_train.txt", "data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints: ["scripts/run_tower_search.py", "scripts/train_relation_detr_search.py", "configs/detector_relation_detr/train_search.py"]
contract:
  inject_verbatim: [conventions#prohibitions, conventions#issuer_cautions, conventions#env_p0, conventions#folds]
  conventions_rev: "2d946b07a57abebc4a8f66150d6dbaf2ccd22186"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values, no_runindex_hand_edit]
  verbatim_forbidden: true
  allow_write: ["experiments/analysis/dtower_step_profile", "runindex/"]
plan:
  phases:
    - {id: A, name: "開始状態。分岐、andrew の他プロセス、記憶領域、試験の失敗の名前、仮想環境の要約値、装置と電力の上限、前提の PR の統合", gpu: false, est: "1h"}
    - {id: B, name: "一歩の内訳の計測（水準の表のとおり）", gpu: true, est: "3h"}
    - {id: C, name: "集計、検証、報告", gpu: false, est: "1h"}
  gates:
    - {id: G1, after: A, check: "分岐が feat/ で始まり起点が origin/phase0 で、PR 290 の内容が起点に在り、本契約以外の compute プロセスが無く、記憶領域と失敗の名前と仮想環境の要約値と電力の上限を記録した", on_fail: stop}
  env:
    venv: ".venv"
    preflight: [venv_active, gpu_free]
  resources: {server: andrew, gpu: 2, est_hours: 5}
outputs:
  must_have: [REPORT.md, RESULT.md, result.yaml, audit.md]
  destination: "experiments/analysis/dtower_step_profile/"
  acceptance:
    - "a: 開始状態として、分岐、起点、PR 290 の内容が起点に在ること、開始前から在る未追跡、andrew の compute プロセスの一覧、記憶領域の空き、試験の失敗の名前、既存の仮想環境のパッケージの一覧の要約値、GPU ごとの電力の上限と装置の型と driver、論理 CPU 数が記録されている"
    - "b: 水準の表の各水準で、一歩の時間と、その内訳（読み込みの待ち、順伝播、損失と対応づけ、逆伝播、最適化器の更新、2 プロセスの同期の待ち、残り）が歩ごとの記録から集計され、内訳の和が一歩の時間と合うこと（差を記録）が示されている。GPU の使用率は歩の区間だけで平均されている"
    - "c: 同じ入力を繰り返し使う水準（読み込み無し）が在り、読み込み有りとの一歩の差が記録されている"
    - "d: 各水準で読み込んだ枚数が batch × 歩数と一致し、COCO の重みを読んだ記録があり、重みは保存されず、既存の run・checkpoint・凍結源・既存の仮想環境・third_party を変えていない。試験の失敗が増えていない。forbidden-check の違反のうち本契約の経路のものが 0 件"
    - "e: test の動画のフレームを一度も読んでいないことが、読んだ動画の集合で示されている"
    - "f: 記述が SPEC の読み方の規則に沿い、設定の採否や推奨を書いていない"
    - "g: PR が Draft でなく存在し、base が phase0、分岐が feat/dtower-step-profile"
  report_to: [notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "andrew に本契約以外の compute プロセスがある場合（止めずに利用者に諮る）"
    - "PR 290 の内容が起点に無い場合"
    - "内訳を測る口が、既存スクリプトの既定の挙動か third_party を変えないと作れない場合"
    - "記憶領域が足りない場合"
    - "実行基盤が書き込み、移動、削除を拒む場合"
