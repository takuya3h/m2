spec_version: 2
meta:
  task_id: "T-2026-11-22-dtower-class-error-breakdown"
  kind: analysis
  title: "検出塔の保存済みの val の予測から、クラス別の誤りの分解・取り違えの相手・クラス別の AP50 と AP75・直した場合の上限の目安・Fold と動画ごとの値を出す（非公式、andrew、GPU を使わない、学習も推論もしない）"
  origin: claude-app
  chat_url: ""
  created_at: "2026-11-22T03:30:00Z"
  created_from:
    runindex_commit: "036d6a60"
    counts: {index: 2668, experiments: 1347, verdicts: 2067}
  depends_on:
    - T-2026-11-07-dtower-rerun
    - T-2026-10-19-stage2-pilot-fix-epoch4-shuffle
  amendments:
    - date: "2026-11-22"
      reason: "SPEC §4.5 (e) の工程の正解の出所（§1.2 のとおり前回の予備測定の正解の腕と同じ data/processed/phase_manifest。scripts/stage2pilot/common.py の phase_sequences）は公式分割ごとのファイルである。Fold B〜E では公式の test の動画 04・05・07 の工程の注釈（test.json）が train か val に要り、train.json・val.json には各 Fold の test の動画の項目も入る。実行者が選択肢（test.json も開く／Fold A だけで (e) を出す／clip ごとの CSV を使う）を示し、利用者が選んだ（2026-11-22、選択式）: 「test.json も開く」= Fold ごとにその Fold の train と val の動画の項目だけを使い（scripts/stage1_ptower.py の load_fold と同じ読み方）、各 Fold の test の動画の項目は使わず、そのことを読んだファイルの一覧と audit に書く。Fold A は train.json と val.json だけを開く"
      diff: "本文の変更なし（SPEC §2 の「test の動画の予測と注釈を読まない」を、Fold ごとにその Fold の test の動画の項目を使わない意味で読むと決めた。検出の test のファイル（eval_test.*、instances_test.json、per_class_ap_test.json、eval_test.json）は従来どおり開かない）"
intent:
  question: "検出塔の val でクラス別 AP が低いクラス（Forceps、Gauze、Hook、Scissors）の誤りは、クラスの取り違え・位置のずれ・見落とし・重複・背景への誤検出のどれが多いか。取り違えの相手はどのクラスか。クラスだけ、枠だけ、在否だけ、工程で在り得ないクラスだけを正解に合わせて直すと、クラス別 AP はそれぞれどれだけ上がるか。これらは Fold と動画でどう変わるか"
  decision_at_stake: "低いクラスを上げる打ち手（検出塔の側、工程の信号の渡し方の側、工程より細かい信号の側）のどれを次の探索の方向にするかを利用者が考える材料。非公式の記述で、関門の判定と設計の判断（案の採否を含む）には使わない"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery の動画 01〜15。各 Fold（conventions#folds）の val の予測と val の注釈、train の注釈（box の数と工程との共起の計算だけ）を読む。test の動画の予測と注釈は一度も読まない。塔は学ばず、推論もしない"
    split_files: ["data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints:
      - "scripts/eval_relation_detr_map.py"
      - "experiments/analysis/dtower_rerun/tools/eval_dump.py"
