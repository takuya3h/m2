    - conventions#issuer_cautions
    - conventions#env_p0
    - conventions#folds
    - conventions#split
    - conventions#eval_recipe
    - conventions#det_groups
  conventions_rev: "2d946b07"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values]
  verbatim_forbidden: true
  allow_write:
    - "experiments/analysis/dtower_class_error_breakdown/"
plan:
  phases:
    - {id: A, name: "開始状態と、保存済みの予測・注釈の実在の確認", gpu: false, est: "1 時間"}
    - {id: B, name: "保存済みの予測から記録の値を再現する", gpu: false, est: "1 時間"}
    - {id: C, name: "クラス別の分解・取り違えの表・AP50 と AP75・上限の目安・Fold と動画ごとの表", gpu: false, est: "2〜4 時間"}
    - {id: D, name: "集計・報告・PR", gpu: false, est: "1〜2 時間"}
  gates:
    - {id: G1, after: A, check: "凍結した塔の Fold A の val の予測の保存が在り、読んだ材料の一覧に test の予測と注釈が無い", on_fail: stop}
    - {id: G2, after: B, check: "保存済みの予測から計算し直した overall mAP とクラス別 AP が、対象のすべての塔と Fold で記録と表示の桁で一致する", on_fail: stop}
  env:
    venv: ".venv"
    preflight: [venv_active]
  resources: {server: andrew, gpu: 0, est_hours: 8, runs: 0}
outputs:
  must_have: [REPORT.md, RESULT.md, result.yaml, audit.md]
  destination: "experiments/analysis/dtower_class_error_breakdown/"
  acceptance:
    - "a: 開始状態（分岐、起点、前提の道具と記録の在否、未追跡、使った仮想環境と pycocotools の在否、試験の失敗の名前）が記録されている"
    - "b: 対象の塔と Fold ごとに、保存済みの val の予測の経路・hash・画像数・予測数が記録され、無いものは理由つきで UNKNOWN になっている"
    - "c: 保存済みの予測から計算し直した overall mAP・クラス別 AP・signature class の AP・negative control の AP が、記録と表示の桁で一致している"
    - "d: SPEC §4.2 と §4.3 の GT の側の分解と取り違えの表が、対象の塔と Fold ごと・クラスごとにあり、区分の件数の和がクラスごとの GT の数と一致している"
    - "e: SPEC §4.4 の予測の側の分解が、対象の塔と Fold ごと・クラスごとにあり、区分の件数の和が足切りを通った予測の数と一致している"
    - "f: クラス別の AP・AP50・AP75 が、対象の塔と Fold ごとにある"
    - "g: SPEC §4.5 の五つの直し方それぞれで、直す前と後のクラス別 AP・AP50 と差が、対象の塔と Fold ごとにある。直す前の値が完了判定 c の値と一致している"
    - "h: SPEC §4.6 の Fold ごと・動画ごとの表（クラス別の train の box の数と動画の数、val の box の数、AP、AP50）がある"
    - "i: test の動画の予測と注釈を、どの段でも読んでいないことが、読んだファイルの一覧で示されている"
    - "j: 保存先の既存の中身、前回までの契約の出力、data の注釈、凍結した塔の重み、third_party、既存の仮想環境を変えていない。試験の失敗が増えていない"
    - "k: PR が Draft でなく存在し、base が phase0、分岐が feat/dtower-class-error-breakdown"
  report_to: [notion_run_ledger]
