deviations:
  - type: judgement
    note: >-
      3.11 系の実体がホストに一つも無く（~/.local/share/uv/python/ も ~/.pyenv/ も不在、
      /usr/bin/python3 は 3.12.3）、貼り直す先が存在しなかった。禁止 7 に触れず 6.2G を
      守るため uv python install 3.11 で philip と同一パスへ cpython-3.11.16 を用意してから
      貼り直した。.venv の中身は触れておらず du は 6.2G のまま。
  - type: judgement
    note: >-
      .venv/pyvenv.cfg の home 行が消えた pyenv を指したままでは sys.base_prefix が
      解決できず python が起動しないため、退避 /tmp/pyvenv.cfg.bak を取ってから
      home の 1 行だけを新しい実体へ書き換えた。SPEC は繋がりの貼り直ししか指示していない。
  - type: environment
    note: >-
      送出の経路を https へ切り替えなかった。SPEC Task 1 Step 5 の前提「鍵は消えている」が
      bengio では不成立で、ssh -T git@github.com が Hi takuya3h! を返し git fetch も成功する。
      credential.helper が未設定のため https へ切り替えると動いている経路を壊す。加えて
      git remote set-url --push は実行環境の権限判定に拒否された。git@ のまま維持した。
  - type: environment
    note: >-
      SPEC の終了コード取得 ${PIPESTATUS[0]} は bash の様式で、本実行環境の zsh では
      空文字を返す。判定を空振りさせないため ${pipestatus[1]}（小文字・1 始まり）へ
      読み替えて実測した。

issuer_defects:
  - type: shell_assumption
    note: >-
      終了コードの取得に bash 専用の ${PIPESTATUS[0]} を使っている（SPEC Task 5 Step 3 ほか）。
      本実行環境のログインシェルは zsh であり、指示どおり実行すると validate_exit= のように
      値が空のまま表示され、終了コードを見る検査が空振りする。zsh は ${pipestatus[1]}。
  - type: shell_assumption
    note: >-
      source が単独の命令で終わる書き方になっており、P9 spec_lint の separated_source が
      SPEC.md:396,399,402 の 3 箇所で該当した。命令ごとに新しいシェルが起きる実装系では
      前の命令で読み込んだ仮想環境が次へ引き継がれず、指示どおり実行すると venv 外の
      python で make が走る。読み込みは同じ命令の中に入れる必要がある。

