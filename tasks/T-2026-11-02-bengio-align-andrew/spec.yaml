spec_version: 2
meta:
  task_id: "T-2026-11-02-bengio-align-andrew"
  kind: impl
  title: "bengio を andrew に揃える: Relation-DETR の本体と拡張のビルド、Stage 2 の材料の写し、前の契約の残り物の片付け"
  origin: claude-app
  chat_url: ""
  created_at: "2026-11-02T12:40:00Z"
  created_from:
    runindex_commit: "68befc3b62ffc071077cca446df5d3c83b8c38b9"
    counts: {index: 2363, experiments: 1130, verdicts: 1736}
  depends_on: [T-2026-11-02-bengio-andrew-env-survey]
  amendments: []
intent:
  question: "調査の一覧どおりに bengio を andrew に揃え、前の契約の残り物を片付けたあと、bengio の Relation-DETR の本体と拡張が andrew と同じに動き、検出塔の評価が記録の値を返すか"
  decision_at_stake: "両ホストで同じ設定の学習を回して指標の差と学習の速さの差を測る次の契約を、bengio で起票できるか"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery-Tool の折り A の val（検出塔の評価の確かめに一本だけ使う）"
    split_files: ["data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints: ["scripts/grasppilot/reldetr_digest.py", "scripts/grasppilot/proc_enum.py", "scripts/eval_relation_detr_map.py", "scripts/stage2pilot/pd_eval.py", "scripts/stage2pilot/det_metrics.py", "scripts/task_start_classify.py"]
contract:
  inject_verbatim: [conventions#prohibitions, conventions#issuer_cautions, conventions#env_p0]
  conventions_rev: "b59081e0cfe28a9be4acd870d2636d6a637708ed"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values, no_runindex_hand_edit]
  verbatim_forbidden: true
  allow_write: ["experiments/analysis/bengio_align_andrew/"]
plan:
  phases:
    - {id: A, name: "開始状態。前後で比べる対象の要約値。調査の記録と今の状態の照合", gpu: false, est: "1h"}
    - {id: B, name: "Relation-DETR の本体を andrew に揃える。bengio の版が版管理の記録から戻せることを先に確かめる", gpu: false, est: "1h"}
    - {id: C, name: "MS-Deform-Attn の拡張を本体の経路で作り直す。検出塔の評価を一本回して記録の値と比べる", gpu: true, est: "1h"}
    - {id: D, name: "Stage 2 の材料を andrew から写す", gpu: false, est: "1h"}
    - {id: E, name: "前の契約の残り物を片付ける", gpu: false, est: "1h"}
    - {id: F, name: "検証、報告、PR", gpu: false, est: "1h"}
  gates:
    - {id: G1, after: A, check: "分岐が feat/ で始まり起点が origin/phase0。bengio main・andrew main・重ねの BODY の Relation-DETR の要約値が調査の記録と一致。andrew の Stage 2 の材料の要約値が調査の記録と一致", on_fail: ask}
    - {id: G2, after: B, check: "bengio main の Relation-DETR の source と all の要約値が andrew main と一致。checkpoints の 12 件の要約値が前後で一致", on_fail: stop}
    - {id: G3, after: C, check: "拡張のビルドが本体の経路を指し、読み込めた。検出塔の val の overall AP と標的群 AP が記録との差 1e-6 以内", on_fail: ask}
  env:
    venv: ".venv"
    preflight: [venv_active, gpu_free]
outputs:
  must_have: [REPORT.md]
  destination: "experiments/analysis/bengio_align_andrew/"
  acceptance:
    - "a: 開始状態と、前後で比べる対象の要約値が記録されている"
    - "b: bengio main の Relation-DETR の source と all の要約値が andrew main と一致し、揃える前の bengio の版が版管理下の差分から戻せることを確かめてある"
    - "c: 拡張のビルドの記録が本体の経路を指し、検出塔の val の値が記録との差 1e-6 以内である。拡張が読み込まれたことが評価の記録にある"
    - "d: Stage 2 の材料が andrew と同じ経路に置かれ、要約値が andrew と一致する"
    - "e: 片付けの対象の各項目に、片付けたか残したかと理由がある。残し方の条件に当たったものは残してある"
    - "f: 片付けの対象外のものの要約値か大きさが前後で一致する"
    - "g: 試験の失敗と収集の失敗の名前の集合が記録され、開始時との差が名前ごとに説明されている"
    - "h: andrew に書き込んでいない。本契約の出力が同期で他のホストへ渡っていない"
    - "i: PR が存在し、base が phase0、分岐が feat/bengio-align-andrew、Draft でない"
  report_to: [notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "片付けの対象の worktree か分岐に、遠隔にも phase0 にも無い commit か、commit されていない変更がある場合"
    - "除外の行を外すと git status に新しく現れるファイルがある場合"
    - "片付けの対象を使っているプロセスがある場合"
    - "削除が実行基盤に拒まれた場合"
    - "andrew で読むために何かを書く必要が出た場合"
