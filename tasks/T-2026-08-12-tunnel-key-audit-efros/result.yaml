    note: >-
      指紋の照合が空振りでないことを、受け入れ一覧に実在する別の指紋を与えて確かめた
      （中継の鍵は 0、実在する指紋は 1）。秘匿の検査が働くことを、鍵の書き出しを模した囮
      （BEGIN OPENSSH PRIVATE KEY の行）で確かめた（囮で 1）。記録に対する検査の一致 2 件は
      sshd_config のオプション名で値ではないことを一件ずつ実体で確認した。base64 の形の
      一致 1 件も検査模様を文章に書いた箇所で、一致長は 4 文字（実鍵は 68 文字以上）。
  - id: G2
    verdict: pass
    note: >-
      通らないはずの鍵として /dev/null を、到達できた宛先 lecun へ与え、Permission denied で
      REACHABLE が 0 件であることを確かめた。鍵の代理が接続不能（ssh-add -l が Error
      connecting to agent）であることも測り、-i が識別を決めていることを裏づけた。同じ lecun が
      専用鍵では REACHABLE を返す。対象一覧は三つの出所から集め、和集合の他ノード 10 台に対し
      測定 10 件、AUTH_OK 0 + DENIED 9 + NOCONN 1 = 10 で合計が一致した。

