followups:
  - >-
    鍵は対ごとに配られている。命名が宛先を含むこと、手元 5 鍵すべてが自ホストの
    authorized_keys に無いこと、中継の鍵が他 9 台のどこにも通らないことの三つが一致する。
    中心の移設は設定の変更では済まず鍵の配布を伴う。
  - >-
    efros が受け入れているのは 3 者のみ（利用者の Mac、aolab、lecun）。efros を中心にするには
    最低 8 台分の登録追加が要る。加えて efros の住所は 172.17.0.21 で容器の内側にあり、
    物理側に 50072 の転送があるかは自ホストからは測れない。転送が無ければ鍵を配っても届かない。
  - >-
    efros から入っていけるのは lecun のみ（専用鍵で REACHABLE）。philip は経路が無く判定不能。
    他 8 台は専用鍵が存在せず Permission denied。lecun を中心にできるかは他の 9 台から lecun へ
    入れるかに依存し、efros からは測れない。
  - >-
    ~/.ssh/config の philip 用 IdentityFile が macOS の経路 /Users/dakyo-mba/ を指しており
    このホストに存在しない。別名 ssh philip では指定した鍵が読めない。ただし中継はこの別名を
    使わず keeper.sh が経路を直接与えるため、同期停止の原因ではない。
  - >-
    id_ed25519_github.pub の注釈が ubuntu@lecun である。efros の鍵なら ubuntu@efros に
    なるはずで、lecun で作った鍵が複製された可能性を示唆する。注釈は自己申告であり断定しない。
    github 用であり中継には使わないため本契約の判断には影響しない。

