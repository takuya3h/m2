deviations:
  - type: spec_defect
    note: >-
      Task 3 Step 2 の命令に -o UserKnownHostsFile=/tmp/kh_audit.txt を足した。SPEC の
      accept-new は新規ホストへの接続時に ~/.ssh/known_hosts へ書き込み、禁止 2 と衝突するため。
      既存の known_hosts を /tmp へ複製してから使い、無人で止まらないという意図を保った。
      迂回しなければ 8 件の書き込みが ~/.ssh/ に入っていたことを実測で確認している。
  - type: judgement
    note: >-
      SPEC にない追加測定を行った。中継の鍵だけでは結果が Permission denied 一色になり
      「efros はどこへ入れるか」の判断材料にならないため、専用鍵 id_rsa_efrostolecun で
      lecun を測り REACHABLE を得た。同じ宛先が鍵によって異なる結果を返すことが、
      測定が鍵で識別できていることの裏づけにもなった。
  - type: judgement
    note: >-
      鍵の代理の状態を測った。SPEC は要求していないが、-i /dev/null の陽性対照が代理経由で
      迂回されていないことを示すために必要と判断した。SSH_AUTH_SOCK は設定されているが
      実体の靴下が無く、代理は使えないことを確認した。
  - type: judgement
    note: >-
      手元 5 鍵すべてについて受け入れ照合を行った。SPEC は中継の鍵 1 件のみを求めているが、
      共有鍵方式かどうかの判定には全件が要ると判断した。5 件すべて 0 であり、
      名前が対ごとであることと一致した。
  - type: judgement
    note: >-
      ip コマンドが不在のため住所の測定を /proc/net/fib_trie と /etc/hosts と hostname -I の
      三通りで行い、いずれも 172.17.0.21 で一致することを確認した。SPEC が fib_trie を
      代替として挙げているため、その範囲内である。

issuer_defects:
  - type: self_contradiction
    note: >-
      禁止 2 は ~/.ssh/** を変更することを禁じているが、Task 3 Step 2 の命令は
      -o StrictHostKeyChecking=accept-new を含み、新規ホストへ接続したときに
      ~/.ssh/known_hosts へ書き込む。efros は他 8 台へ接続したことがないため、指示どおり
      実行すれば必ず書き込みが起きて禁止に違反する。書き込み先を /tmp へ逃がして測定した
      ところ、その迂回先は 9 件から 17 件へ 8 件増えた。接続が成立した 9 台のうち lecun のみ
      既知で残り 8 台分が新規に書かれた計算と一致する。SPEC のままならこの 8 件が
      ~/.ssh/known_hosts に入っていた。UserKnownHostsFile の指定を SPEC 側に含めるべきである。

