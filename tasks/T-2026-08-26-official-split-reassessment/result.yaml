      1・3・5 の三つだけで、2・4・6 は 0 件である。
  - id: G2
    verdict: pass
    note: >-
      公式の分割で判定を持つ 136 行すべてについて効果量・種の数・揺らぎの出所・決定性の有無を
      表にした。揺らぎの出所は sigma_source=paired_delta が 136/136 件で、対の差から求めたものである。
      種は delta_n_seeds=3 が全行。決定性を表す列は experiments.csv にも index.csv にも 0 件で、
      全行を「記録なし」とした。推定で埋めた欄は無い。
  - id: G3
    verdict: pass
    note: >-
      分け方の間の相関を扱う判定は当てていない。公式の分割には分け方が存在せず、索引に fold/cv/leave を
      名に含む列が 0 件であることを機械的に確かめた。対照は陽性 significant（|Δ|/σ=11.423・同符号 True）、
      陰性 not_significant（|Δ|/σ=0.207・同符号 False）で 55.1 倍に分離した。陰性対照は同じ学習・評価・
      対の差の手続きを通ったうえで零に近い値になっており、構造上の零ではない。
  - id: G4
    verdict: pass
    note: >-
      撤回の対象（工程を弁別しない術具を落とす）について公式の分割の 11 件を全件並べ、一つ抜き検証側の
      報告と並置した。食い違いは符号の向きにある。公式の分割の検証側では分類の正しさが 11 件中 10 件で正、
      工程平均が 8/11 件で正であるのに対し、撤回の根拠は負の方向であった。どちらが正しいとは書いていない。

