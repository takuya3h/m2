issuer_defects:
  - type: asserted_without_measuring
    note: >-
      「候補は上から順に試され、最初に見つかったものが使われるはずである」と述べ、足す位置と帰結の表も
      候補列を前提に書かれている。実装は候補列ではなく三項一行で、一つ目だけが検査され二つ目は
      存在を確かめない無条件の落とし所である。字義どおり「末尾に候補を足す」と読んで
      || echo ~/local/m2 を三つ目に並べると、二つ目が常に当たるため三つ目には到達せず、
      修正が何の効果も持たないまま「足した」と報告することになった。
  - type: self_contradiction
    note: >-
      禁止 1 が「既存の候補の順序を変える。既存の候補を削る」を禁じ、Task 2 Step 1 が
      「既存の行は一文字も変えない」と求める一方で、同じ Step が「~/local/m2 を既存の候補の後ろへ足す」
      と指示する。実装は一行の三項であるため、行を一文字も変えずにその中の候補列へ後ろから足すことは
      字義どおりには不可能である。別の文として次の行へ足すという解釈を実行者が補う必要があった。
  - type: check_does_not_check
    note: >-
      完了判定 O は「配置 → 常駐処理を起こし直す → 抑止が効いた旨が記録に出る」という順序を求めるが、
      keeper.sh:49 が ~/bin/m2-sync.sh を毎ループ origin/phase0 から自己更新する。よって統合前に
      配置した m2-sync.sh の修正は、常駐処理が repo を見つけた最初の周回で戻される。
      指示どおりの順序を守ると O は原理的に達成できず、修正版を置き直して手で一度走らせる必要があった。
      SPEC 自身が「m2-sync.sh は常駐処理が自己更新する」と書きながら、この帰結を検査に織り込んでいない。

