issuer_defects:
  - type: self_contradiction
    note: "契約 §1.2 が耐えた結論として引く『十五の分け方すべてで同じ向きに動いた』は、代理の C01 すなわち pres - gap の値である。これは GAP を丸ごと落として術具だけにする比較である。一方 §2.1 は術具の次元だけを落とし他の入力には触れるなと指示しており、これは C04 すなわち gap+pres - gap に当たる。代理側の C04 は符号 12/15 で R1 は edit も seg-F1@50 も検出していない。指示どおり腕を作ると、契約が前提とした結論とは別の比較を測ることになる。"
  - type: self_contradiction
    note: "outputs.expected_runs 30 と、確定した二つの則の双方を当てるという要求が両立しない。R2 は反復 LOVO を要し、代理側の記録では 24 反復 x 12 fold x 2 腕 = 576 run を使っている。さらに動画母集団を絞る配線も要る。指示どおり両方を当てようとすると宣言の 20 倍の run が要り、宣言の本数で実行すると禁止 8 に触れる。申し送り 4 が同型の誤りを三回繰り返したと自認しているが、本契約が四回目である。"
  - type: check_does_not_check
    note: "禁止 9 は分類の指標を主張の根拠に用いるなと定めるが、主終点 edit の値は分類の指標で選ばれた epoch のものである。train_b2a.py の best 更新条件が val の phase_accuracy であるためで、edit が最良の epoch ではない。指示どおり実行すると、分類の指標を根拠にしていないと報告しながら主終点の値は分類の指標が選んだ点で読まれる。両腕に等しくかかるため対の差は受けにくいが絶対値は分類側の選択に依存する。"
  - type: check_does_not_check
    note: "契約 §2 が定める漏れの検査は評価側の動画が学習側に在るかだけを見る。最良 epoch は抜いた動画の正解で選ばれており、その経路は検査されない。先行契約 T-2026-08-26-oracle-ceiling-lovo で同型の誤りを記録したが本契約でも解消していない。指示どおり実行すると漏れ 0 と報告しながら抜いた動画のラベルが epoch 選択に使われる。"

