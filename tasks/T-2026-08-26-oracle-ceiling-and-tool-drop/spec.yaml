intent:
  question: "代理モデルで見えた二つの所見、すなわちオラクル術具存在の追加利得がほぼ無いことと、工程を弁別しない術具を落とすと macro-F1 が上がることは、本番の時系列モデルの構造でも保たれるか"
  decision_at_stake: "工程認識のために検出器を強化する投資を続けるかどうか。および術具除去を実務上の主路として扱い続けてよいかどうか"
  hypothesis: "オラクルの追加利得は小さいままであり、術具除去の macro-F1 改善は本番の受容野を与えても残る。ただし代理で見えた効果が本番の構造で消えた前例があるため、消える可能性も同等に扱う"
  related:
    backlog: []
