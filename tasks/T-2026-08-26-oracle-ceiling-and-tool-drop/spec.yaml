plan:
  phases:
    - {id: A, name: "環境と入力の実在確認", gpu: false, est: "short"}
    - {id: B, name: "オラクル上限の評価", gpu: true, est: "short"}
    - {id: C, name: "一本の所要時間の実測と本数の決定", gpu: true, est: "short"}
    - {id: D, name: "術具除去の対測定", gpu: true, est: "unknown"}
    - {id: E, name: "報告", gpu: false, est: "short"}
  gates:
    - {id: G1, after: A, check: "必要な入力がすべて実在し、所在が実測で確かめられている", on_fail: stop}
    - {id: G2, after: B, check: "上限の評価が完走し、値が記録されている", on_fail: stop}
    - {id: G3, after: C, check: "残り時間で判定に足る本数が入る見込みがある", on_fail: skip}
    - {id: G4, after: D, check: "対の両側が同数そろい、実行順序が記録されている", on_fail: ask}
  env:
    venv: ".venv"
    preflight: [venv_active, deterministic_flags]
  resources: {server: "lecun", gpu: 1, est_hours: 0, runs: 0}
prereg:
  prediction: "オラクル術具存在を与えた腕は、予測された術具存在を与えた腕に対して分類の指標をほとんど動かさない。術具除去の腕は、除去しない腕に対して主終点を改善する。ただし本番の受容野で消える可能性も同等に扱い、消えた場合はそのまま報告する"
  primary_endpoint: "macro-F1"
  decision_rule: "判定は本契約では行わない。効果量と、対のうち改善側へ倒れた個数の両方を報告する。判定則は同時に走る別契約が確定させるため、そこで確定した則を起票者が後から当てる。本数が事前に定めた最小に満たない場合は判定不能と記し、数値から結論を作らない"
  stop_conditions:
    - "必要な入力が実在しないことが判明した場合は Phase A で止める"
    - "残り時間で判定に足る本数が入らない場合は Phase D へ入らず Phase B までの結果で報告する"
    - "対の両側の本数がそろわない見込みになった場合は新たな腕を始めず、そろっている対だけで報告する"
  committed_at: "2026-08-25T21:25:02+00:00"
  commit: "1f4dd9c7e886aad2db9c4650b31a32d364f1f95a"
