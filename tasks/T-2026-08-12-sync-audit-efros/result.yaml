followups:
  - >-
    両フォルダとも versioning.type が (none) である。maxConflicts=10 のため両側編集は
    .sync-conflict-* として残るが、他ホストで削除されたファイルは復旧時にこちらでも消え、
    戻す手段が無い。復旧前に退避するかどうかの判断材料になる。
  - >-
    中心ホストの名前とアドレスは keeper.sh:16,19 に直書きされている
    （ubuntu@192.168.196.150 -p 50072）。中心を別ホストへ移すには
    scripts/sync/keeper.sh の変更と各ノードへの ~/.tunnel_to_philip の配り直しが要る。
    設定や環境変数では動かせない。
  - >-
    globalAnnounceEnabled=false かつ relaysEnabled=false であり、他 9 台の 22000 は
    REFUSED である。星型の中心を失うと迂回路が無い構成になっている。
  - >-
    efros 側の未伝播の分岐は 171 ファイル / 2044979 バイト。うち 110 が再生成可能な
    キャッシュ、59 が 2026-08-11T16:11:59 に一括導入されたベンダ提供物、1 が追記ログ。
    実体のある局所設定は codex/config.toml（1008 バイト）1 件のみである。
  - >-
    inventory.tsv（2531 行）は他ホストの同名ファイルと要約値で突き合わせるためのもの。
    並行実行している他ホストの一覧が揃えば、分岐箇所は機械的に判定できる。
  - >-
    tools/report_task.py の秘匿検査が git のコミットハッシュを W&B の鍵と誤判定する。
    40 桁 16 進という形が同一で、判定に使える情報が足りない。本契約では origin/phase0 の
    先頭 a85cf78 の完全形 4 箇所で送信が止まり、短縮形に直して再送した。git ハッシュは
    この種の報告に頻出するため偽陽性は構造的に起きる。送信を止める側に倒れており安全側
    ではあるが、40 桁 16 進を git cat-file -e で実在するオブジェクトか照会すれば
    切り分けられる余地がある。
  - >-
    tools/report_task.py:131 の _rich_text が本文を Python のコードポイントで 2000 ごとに
    切るが、Notion の上限は UTF-16 コード単位で数えられる。BMP 外の文字を含む切片だけが
    上限を超え HTTP 400 で送信が失敗する。本契約では BMP 外の文字が本文に 1 つあり、
    chunk[2] がコードポイント 2000 に対し UTF-16 で 2001 となって API が rich_text[2] を
    指した。添字まで一致することを実測で確認した。読み取りのみの契約のため道具は直さず、
    本文側で BMP の記号へ置き換えて送った。_rich_text は UTF-16 コード単位で切るべきである。
  - >-
    SPEC Task 6 Step 5/6 の変更範囲指定が tasks/README.md:283-288 と食い違う。README は
    抽出物 docs/sessions/digest/ を契約の記録と一緒に commit することを求め、未追跡放置が
    merge --ff-only を壊す実測（B-30、5 台）を根拠に挙げている。本契約では契約の commit を
    SPEC どおりに保ち抽出物を別 commit に分けて両立させたが、今後の SPEC 雛形では
    Step 5 の許容集合に抽出物を含めるか、README 側で例外を明示するかの整理が要る。

