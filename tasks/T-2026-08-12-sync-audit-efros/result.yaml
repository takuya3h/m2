  - type: judgement
    note: >-
      Task 2 Step 1 の ps -eo args | grep -c "[k]eeper.sh" が 2 を返したが実体は 1 だった。
      原因は実行者が付けた表示用ラベル echo "... keeper.sh ..." が zsh -c の命令行として
