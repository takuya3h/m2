issuer_defects:
  - type: check_does_not_check
    note: >-
      Task 3 Step 2 は (ss -ltn || netstat -ltn || echo "手段なし") とし「零行なら手段が
      無かったということ」としているが、efros には ss も netstat も lsof も存在しない。
      指示どおり実行すると「手段なし」の 1 行だけが残り、待ち受け一覧は UNKNOWN として
      報告されることになる。実際には /proc/net/tcp と /proc/net/tcp6 から 26 件が取れ、
      その中に「22001 が待ち受けに存在しない」という、プロセス一覧とは独立に中継が
      張られていないことを示す証拠が含まれていた。測れるものを測れないと報告するところだった。
  - type: check_does_not_check
    note: >-
      Task 5 Step 5 の find ~ -maxdepth 3 -name "syncthing*.log" は 0 件を返す。実ファイルは
      先頭がドットの ~/.syncthing.log（8553294 バイト）で、この模様には一致しないためである。
      指示どおり実行すると「同期処理のログは見つからなかった」となり、停止時期の第二の
      独立した情報源が失われる。実際にはこのファイルに 2026-08-06 20:23:41 Lost device
      connection という直接の時刻記録があり、本報告の採用値はこれである。SPEC 自身の
      申し送り 7「探す対象の名前を決め打ちしない。集合として列挙してから絞る」に反している。
  - type: self_contradiction
    note: >-
      inputs.data.dataset に egosurgery_phase_v1、inputs.data.split_files に
      data/splits/ego_val.txt が宣言されているが、Task 1 から Task 6 のどの Step も
      これらを参照しない。本契約は同期経路の読み取り監査でありデータセットも分割も
      登場しない。prohibitions の no_split_redefine / no_raw_write / no_frozen_change も
      本契約では成立しようがない。指示どおり実行するとこれらは解決先を持たないまま報告に
      残り、読む側に「この監査はデータを参照した」と誤解させる。参照解決の手順が空回りする。

