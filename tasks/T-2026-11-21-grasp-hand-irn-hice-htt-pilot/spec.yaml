  task_id: "T-2026-11-21-grasp-hand-irn-hice-htt-pilot"
  kind: analysis
  title: "前回のグラフの予備と同じ検出塔・把持塔 G3・手の塔 H4 の予測を、先行研究の三つの渡し方（IRN・HiCE・HTT）で工程塔の時間ヘッドの入力へ渡す非公式の予備測定（andrew、Fold A、seed 42、W1・W2・W3、収束規則。塔の学習と推論はしない）"
  origin: claude-app
  chat_url: ""
  created_at: "2026-11-21T00:00:00Z"
  created_from:
    runindex_commit: "036d6a60"
    counts: {index: 2668, experiments: 1347, verdicts: 2067}
  depends_on:
    - T-2026-11-20-grasp-hand-graph-pilot
