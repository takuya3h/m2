    - T-2026-11-09-grasp-pilot-converge
    - T-2026-10-18-stage2-pilot-folda
  amendments:
    - date: "2026-11-21"
      reason: "preflight P6 が未回答 3 件で FAIL し、利用者に 3 項目を示した。利用者の回答（2026-11-21、選択式）: (1) 停止条件に当たったときの続け方は「前回と同じく任せる」= 停止は gate の FAIL（on_fail: stop）・捏造の禁止と未測定の UNKNOWN・allow_write の外への書き込み・他の契約の compute に限る。それ以外の escalate_if は実行者が判断し、amendments と deviations に記録して進める。(2) 三つの型の定義を変えないと実装できない場合は「最小の変更で進める」= 変える幅を最小にして実行者が決め、変えた箇所と理由を amendments・deviations・RESULT に書く。(3) 確かめの run が一致せず値を流用できない場合は「省いた run を回して埋める」= 流用せず、省いた組み合わせを同じ規則で追加して回し、追加の本数を記録する"
      diff: "governance.decisions_required: [停止条件に当たったときの続け方（実行者は決めない）, 三つの型の定義（SPEC の型の定義の節）を変えないと実装できない場合の変え方, 確かめの run が一致せず、SPEC が値の流用を許す条件を満たさない場合の回し方] -> []（回答は本項の reason）"
    - date: "2026-11-21"
      reason: "SPEC §0 のとおり起点（origin/phase0 4cb85a02、PR 315 の統合 be49c44f の後）で測って差し替えた。runindex_commit は git log -1 -- runindex/、件数は csv.DictReader（見出し行を除く）。contract.conventions_rev は git log -1 -- context/conventions.md で 2d946b07 のまま（差し替えなし）"
      diff: "meta.created_from: {runindex_commit: b524173e, counts: {index: 2647, experiments: 1327, verdicts: 1977}} -> {runindex_commit: 036d6a60, counts: {index: 2668, experiments: 1347, verdicts: 2067}}"
intent:
  question: "前回のグラフの予備と同じ送り手の予測（術具のトークン、自分の左右の手のトークン、持ち手の特徴）を、先行研究の三つの渡し方（IRN の手が問い合わせで術具が鍵の注意、HiCE のフレームの特徴が問い合わせで手が鍵の注意、HTT のフレームごとの一つのトークン）で工程塔の時間ヘッドの入力へ渡すと、同じ型・同じ学習範囲の空の腕と送り手を減らした腕に対して工程の val の値がどう動くか。あわせて、その差が型の間とグラフの型との間でどう並ぶか"
  decision_at_stake: "把持・手・術具の予測を工程塔へ渡す形を、次の予備や提案カードに進めるかを利用者が考える材料。非公式の予備測定で、関門の判定と設計の判断（案の採否を含む）には使わない"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery の動画 01〜15。Fold A（conventions#folds）の train と val だけを使い、test の動画 04・05・07 は一度も通さない。送り手の信号は前回の契約 T-2026-11-20-grasp-hand-graph-pilot が保存先に作ったものを読むだけで、塔の学習も推論もしない。工程塔は前回までの予備測定と同じ凍結した塔"
    split_files: ["data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints:
      - "scripts/stage2pilot/dp_train.py"
      - "scripts/stage2pilot/dp_model.py"
contract:
  inject_verbatim:
    - conventions#prohibitions
    - conventions#issuer_cautions
    - conventions#env_p0
    - conventions#folds
    - conventions#split
    - conventions#crossfit
    - conventions#symmetry
  conventions_rev: "2d946b07"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values]
  verbatim_forbidden: true
  allow_write:
    - "experiments/analysis/grasp_hand_irn_hice_htt_pilot/"
    - "experiments/phase1/grasp_hand_irn_hice_htt_"
plan:
  phases:
    - {id: A, name: "開始状態と前提の実在の確認", gpu: false, est: "1 時間"}
    - {id: B, name: "トークンの組み立てと前回のグラフの節との突き合わせ", gpu: false, est: "1〜2 時間"}
    - {id: C, name: "三つの型の実装、既定の挙動の確かめ、学習前の一致と陽性対照", gpu: true, est: "2〜3 時間"}
    - {id: D, name: "三つの型の腕を W1・W2・W3 で学ぶ", gpu: true, est: "1〜3 時間"}
    - {id: E, name: "集計・報告・PR", gpu: false, est: "2 時間"}
  gates:
    - {id: G1, after: A, check: "起点に前回の契約の道具と記録があり、保存先の信号が前回の目録と一致し、andrew に本契約以外の compute が無く、保存先の空きが足りる", on_fail: stop}
    - {id: G2, after: B, check: "全腕・全設定のトークンの中身が前回のグラフの節と一致し、正解の腕の持ち手の一致の数が前回の報告と同じ", on_fail: stop}
    - {id: G3, after: C, check: "三つの型が SPEC の定義どおりで、既定の挙動が変わらず、学習前の出力が全組み合わせで塔単独と一致し、陽性対照で変わる", on_fail: stop}
    - {id: G4, after: D, check: "SPEC の表の全本が収束規則で終わり、確かめの run の一致と不一致が記録されている", on_fail: stop}
  env:
    venv: ".venv"
    preflight: [venv_active, gpu_free]
  resources: {server: andrew, gpu: 2, est_hours: 9, runs: 250}
outputs:
  must_have: [REPORT.md, RESULT.md, result.yaml, audit.md]
  destination: "experiments/analysis/grasp_hand_irn_hice_htt_pilot/"
  acceptance:
    - "a: 開始状態（分岐、起点、前提の道具と記録の在否、保存先の信号と前回の目録の要約値の照合、未追跡、compute プロセスの一覧、保存先の空き、試験の失敗の名前、既存の仮想環境の要約値、GPU ごとの電力の上限）が記録されている"
    - "b: 全腕・全設定のトークンの中身が前回のグラフの節と一致し、正解の腕の持ち手の一致の数が前回の報告と同じで、腕ごとのトークンと持ち手の在否が SPEC の腕の表と一致している"
    - "c: 型 IRN・HiCE・HTT が SPEC の定義どおりに作られ、腕ごとの問い合わせと鍵の数、HTT のベクトルの次元、入力が無いフレームで interface の出力が零になること、送り手の中身を零にした入力ではフレームの特徴を替えても interface の出力が変わらないことが示され、型と設定ごとのパラメータ数が記録されている"
    - "d: 既存の道具は足す形だけで直され、前回の契約の run を本契約の識別子で回し直した結果が記録と一致している"
    - "e: 学習前の出力が全型・全腕・全設定・全 W で塔単独と一致し、零初期化の線形層を乱数にすると変わる"
    - "f: SPEC の run の表の全本が収束規則で終わり、最良の回と最後の回の val の確率が保存されている"
    - "g: 確かめの run（空の腕の設定による違い、HiCE の D と空の腕、HiCE の DH の N による違い、各型の空の腕とグラフの型の空の腕）の一致と不一致が記録されている"
    - "h: 同じ型・同じ W・同じ設定の中の差と、型の間（グラフの型を含む）の並べの表が、最良の回と最後の回の両方で、6 工程の Jaccard、frame accuracy、7 工程の Jaccard、工程別、動画ごとについて SPEC の読み方で作られている"
    - "i: test の動画 04・05・07 をトークンの組み立て・腕の学習・評価のどこにも通していないことが、各段で通した動画の集合で示されている"
    - "j: 前回までの予備測定の出力と保存先の既存の中身、data の raw と external と注釈、凍結した塔、既存の checkpoint、third_party、既存の仮想環境を変えていない。試験の失敗が増えていない"
    - "k: PR が Draft でなく存在し、base が phase0、分岐が feat/grasp-hand-irn-hice-htt-pilot"
  report_to: [notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "andrew に本契約以外の compute プロセスがある場合（止めて利用者に尋ねる。止めるのはそのプロセスではなく本契約）"
    - "起点に前回の契約 T-2026-11-20-grasp-hand-graph-pilot の道具・記録・目録が無い場合（PR 312 が phase0 に統合されていない場合を含む）"
    - "保存先の信号や前回の組み立ての出力が、前回の目録の要約値と一致しない場合"
    - "トークンの中身が前回のグラフの節と一致しない場合"
    - "三つの型を、既存の道具の既定の挙動や third_party を変えないと実装できない場合"
    - "注意の計算で非数が出る場合"
    - "保存先の空きが足りない場合"
    - "実行基盤が書き込み、移動、削除、外部の取得を拒む場合"
