    - "多数派を出し続けるだけの偽の予測を通した値が併記され、実測がそれを上回るか否かが示されている"
    - "予測の散らばりが次元ごとに示され、定数に近いものがどれかが特定されている"
    - "前の実験の負の効果を、情報が有害と読むか信号が薄いと読むかについて、実測に基づく結論が示されている"
