issuer_defects:
  - type: check_does_not_check
    note: >-
      Task 5 Step 5 の find ~ -maxdepth 3 -name "syncthing*.log" は 0 件を返すが、
      ~/.syncthing.log は 31137 行で実在する。-name のパターンが先頭の . に一致しないためである。
      このファイルは接続喪失の瞬間（2026-08-06 20:24:02 Lost device connection device=GO2U7PF）と
      その後 5 日間の空白を直接記録した唯一の情報源であり、停止時期の最も強い証拠である。
      指示どおり実行して件数だけを見ると「同期処理のログは別の場所に無い」と誤読し、
      最も強い証拠を落としたまま二つの弱い情報源だけで推定することになる。
  - type: check_does_not_check
    note: >-
      Task 2 Step 1 の ps -eo args | grep -c "[k]eeper.sh" と Task 3 Step 1 の
      grep -c "[s]sh .*-L" は、この実行環境では測定命令の全文が別プロセスの args に
      埋め込まれるため自己一致する。実測では keeper を 2 件（実際 1 件）、ssh -L を 1 件
      （実際 0 件）と数えた。SPEC は pgrep -f を過去 2 回の発生を理由に禁じたが、
      その回避策である角括弧法も同じ理由で無効である。角括弧は grep 自身を除くだけで、
      コマンド全文を args に持つ別プロセスは除けない。指示どおり数えると常駐処理が
      二重起動しており中継も動いていると誤読する。
  - type: asserted_without_measuring
    note: >-
      Task 3 Step 2 は ss か netstat のいずれかがあることを前提に「零行なら手段が無かった
      ということ」と書くが、この環境には ss も netstat も lsof も無い（command -v で 3 件すべて
      未導入を確認）。指示どおり実行すると "手段なし" の 1 行が返り、待ち受けの一覧が
      一切得られない。その場合の代替の指示は無い。待ち受けの一覧は「22000 は待ち受けているが
      22001 は存在しない」という結論の根拠であり、これが取れないと Task 3 Step 3 の
      REFUSED の意味を確定できない。
  - type: self_contradiction
    note: >-
      Task 5 Step 3 は Expected を 0 と断定しながら、同じ Step の中で「ファイル名に該当語が
      ある場合はその行を残しつつ、一覧が名前と要約値のみで内容を含まないことを明記する」と
      0 でない場合の扱いを書いている。実測は 4 件であり、4 件すべてがファイル名の語だった。
      Expected 0 を判定基準として素直に読むと、正常な状態（tokenizers.md や secrets.md が
      存在する）で不合格になる。判定は語の件数ではなく列の構造で行うべきである。

followups:
  - >-
    この実行環境では ps と grep による自己一致の回避が原理的に成立しない。測定命令の全文が
    /usr/bin/zsh -c ... eval '<命令全文>' という形で別プロセスの args に現れるため、
    角括弧法も pgrep -f と同じく誤った件数を返す。プロセスを数える手順は /proc/*/cmdline を
    読み自分と祖先を除く形へ統一するのが確実である。手順書の該当箇所を直すかの判断が要る。
  - >-
    ss も netstat も lsof も無い環境では待ち受けの一覧を /proc/net/tcp と /proc/net/tcp6 から
    復号する必要がある。状態 0A が LISTEN、アドレスはリトルエンディアンの hex である。
    手順書に代替として書いておくかの判断が要る。
  - >-
    停止期間に自ホストで更新された 172 件のうち、人が触る設定に当たるのは settings.json
    （14419 バイト、2026-08-11T05:49:59）と codex/config.toml（901 バイト、2026-08-11T21:59:17）
    である。残る 170 件は codex/plugins/cache/ 配下の自動生成物である。
    版の退避は設定で無効（versioning.type が空）であり、上書きされた旧版は残らない。
    衝突ファイルの機構は働いている（過去 10 件の実績）。
  - >-
    他 10 台とは一度も直接接続していない（Established secure connection の相手は 21 件すべて
    philip）。一方で 9 台の SSH ポート 50072 は OPEN であり機器までは届く。
    大域探索と中継は設定で無効（globalAnnounceEnabled=false / relaysEnabled=false）。
    経路の選択肢に関する事実であり、方針の判断はユーザーが行う。
  - >-
    sync-alerts.log に現れるホストのラベルは 16 種（大文字の変種を含む）で、syncthing の
    device 11 台と一致しない。dlstation（ログ）と dlsta（syncthing）、084f3b0911a2
    （コンテナ識別子）、aolab はラベルの対応が付いていない。ホスト名の正本を決めるかの判断が要る。

