gates:
  - id: G1
    verdict: pass
    note: >-
      到達性の道具に開いている先・閉じている先・経路の無い先を与え、三通りが出し分けられる
      ことを確かめた。A_open=OPEN / B_closed=REFUSED / C_noroute=TIMEOUT で期待と全一致。
      192.0.2.1 は RFC 5737 の TEST-NET-1 であり意図的に経路を持たない。あわせて版管理側の
      経路が生きていることを確かめた（git ls-remote が refs/heads/phase0 を 1 行返し exit=0、
      値は a85cf78）。したがって「全ホストへ到達できない」という結果は道具の欠陥でも
      外向き通信の全面障害でも説明できない。
  - id: G2
    verdict: pass
    note: >-
      対象一覧を三つの出所から集めた（ssh_count=4 / hosts_count=7 うち遠隔 0 / stcfg_count=11）。
      和集合は遠隔 10 台で、既知の構成 11 台は遠隔 10 台と自ホストの内訳であり一覧は縮んで
      いない。10 台 x 3 ポート = 30 件を測り、分類の合計 30 = 行数 30 = 対象数 30 で一致した。
      三分類は OPEN 9（すべて 50072）/ REFUSED 18（22000 と 22001）/ TIMEOUT 0 /
      OSERROR:No_route_to_host 3（philip の 3 ポートすべて）。TIMEOUT=0 は grep と python の
      2 経路で確認した（awk による確認は引用の誤りで走っておらず、空振りだった）。
      拒否は機器まで届いていること、経路なしは機器まで届かないことを意味する。
  - id: G3
    verdict: pass
    note: >-
      一覧に内容と資格情報が含まれないことを検査で確かめた。語の検査は 4 件該当したが、
      4 件すべてが第 1 列（経路名）にのみ現れ、第 2 列以降には現れない（tokenizers.md /
      secrets.md / tokens.css / chart-tokens.css というファイル名の語である）。
      さらに列の型を検査し、2531 行すべてが 4 列、第 2 列は整数、第 3 列は ISO 時刻、
      第 4 列は 16 桁の hex であることを確かめた。したがって一覧は名前と大きさと更新時刻と
      要約値のみからなり内容を含まない。識別子は先頭 7 文字のみで API キーは読んでいない。

