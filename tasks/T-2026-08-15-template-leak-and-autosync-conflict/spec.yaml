spec_version: 1

meta:
  task_id: "T-2026-08-15-template-leak-and-autosync-conflict"
  kind: impl
  title: "共有テンプレートに残るホスト固有値を除き、自動同期と契約の衝突を解消する"
  origin: claude-app
  created_at: "2026-08-15T09:00:00Z"
  created_from:
    runindex_commit: "12cc0e8"
    counts: {index: 749, experiments: 206, verdicts: 1038}
  depends_on: ["T-2026-08-14-bundle-attachment-transport"]
  amendments: []

intent:
  question: "同じ事故を再発させる導線を断ち、契約と常駐処理の衝突を解消できるか"
  decision_at_stake: "導線を残したまま運用するか、仕組みで断つか"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints: ["tools/fetch_task.py"]

contract:
  inject_verbatim: [conventions#prohibitions]
  conventions_rev: "d422b08"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_runindex_hand_edit, no_estimated_values]
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "テンプレートに残る固有値の除去", gpu: false, est: "40m"}
    - {id: B, name: "常駐処理と契約の衝突の解消", gpu: false, est: "50m"}
  gates:
    - id: G1
      after: A
      check: "テンプレートから固有値が消え、写しても誤った名前を名乗らないことを確認した"
      on_fail: stop
    - id: G2
      after: B
      check: "契約の実行中に常駐処理が分岐へ書き込まないことを確認した"
      on_fail: ask
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "scripts/"
  acceptance:
    - "共有テンプレートにホスト固有の値が含まれない"
    - "テンプレートを写しても誤った名前を名乗らない"
    - "同種の固有値が他に無いことを確認している"
    - "契約の実行中に常駐処理が分岐へ書き込まない手段がある"
    - "その手段が文書化されている"
    - "資格情報が出力にも記録にも含まれない"
    - "make task-validate が exit 0"
    - "make task-preflight が exit 0"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: [secret_value_printed, autosync_cannot_be_suppressed]
