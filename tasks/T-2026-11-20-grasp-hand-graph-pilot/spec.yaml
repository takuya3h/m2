  amendments:
    - date: "2026-11-20"
      reason: "preflight P6 が未回答 2 件で FAIL し、利用者に二つの項目を示した。利用者の回答「両方その都度諮る」（2026-11-20）。停止条件に当たったら止めて報告し、続け方は利用者がその都度決める。§4 を変えないと実装できなければ変えずに止め、変え方は利用者がその都度決める"
      diff: "governance.decisions_required: [停止条件に当たったときの続け方（実行者は決めない）, グラフの定義（SPEC §4）を変えないと実装できない場合の変え方] -> []（回答は本項の reason）"
    - date: "2026-11-20"
      reason: "G1 で SPEC §1.3 の「G の入力の写し $S/inputs/」が andrew に無く（11-05 の保存先にも inputs/・G の重み・信号が無い）停止して諮った。利用者の選択「原本を本契約へ写す」: COCO instance の重みは 10-31 の保存先の原本（sha256 41b088b62838c986…）を $S/grasp_hand_graph/inputs/coco/ へ写して要約値で照合し、新しい塔の道具はその写しを読む。塔の注釈は hand_tool_seg・hand_seg から本契約で組み直す"
      diff: "SPEC §1.3 の $S/inputs/ -> $S/grasp_hand_graph/inputs/coco/（本契約の写し）"
    - date: "2026-11-20"
      reason: "SPEC §4 の字面に複数の読みがあり（conventions#issuer_cautions 14）利用者に諮った。回答: (1) §4.2 の辺は左・右・両手の 3 種に分け、種類ごとに別の重みで伝える（両手で持つ器具の値 hB は両手の種類の辺として左右両方の手の節へ張る）。(2) DGH-U の持ち手の特徴は [u, u, u]（u = max(hL, hR, hB)）とし、辺は DGH と同じ規則で 3 種とも重み u。(3) 正解の腕の手の節は、同じ側に注釈のマスクが複数あるとき（train 左 45・右 61、val 左 14・右 4 フレーム。どれも 2 つ）それらを合わせた一つのマスクから外接矩形と面積を取る"
      diff: "§4.2 辺: 1 種 -> 3 種（L・R・B）/ §5 DGH-U: 持ち手 [u, u, u]、辺は 3 種とも u / §4.5 正解の手の節: 同じ側の複数のマスクは和集合"
intent:
  question: "自分の手ごとの把持（器具のクラスだけにした把持塔）、自分の左右の手の位置（手の塔）、術具の種類と位置（検出塔）を一つのグラフにして工程塔の時間ヘッドの入力へ渡すと、同じ学習範囲の空の腕と、送り手を減らした腕に対して、工程の val の値がどう動くか。あわせて、器具のクラスだけにした把持塔の器具のクラスの AP が、同じホストで学んだ手のクラスを含む把持塔の器具のクラスの AP と比べてどうか"
  decision_at_stake: "グラフで把持・手・術具の予測を工程塔へ渡す形を、次の予備や提案カードに進めるかを利用者が考える材料。非公式の予備測定で、関門の判定と設計の判断（案の採否を含む）には使わない"
  related:
    backlog: []
inputs:
  data:
    dataset: "EgoSurgery の動画 01〜15。Fold A（conventions#folds）の train と val だけを使い、test の動画 04・05・07 は一度も通さない。把持塔は hand_tool_seg の器具の 3 クラス、手の塔は hand_seg の 4 クラスの注釈で学ぶ。工程塔と検出塔は前回までの予備測定と同じ凍結した塔"
    split_files: ["data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints:
      - "scripts/stage2pilot/dp_train.py"
      - "scripts/stage2pilot/dp_model.py"
contract:
  inject_verbatim:
    - conventions#prohibitions
    - conventions#issuer_cautions
    - conventions#env_p0
    - conventions#folds
    - conventions#split
    - conventions#crossfit
    - conventions#symmetry
  conventions_rev: "2d946b07"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values]
  verbatim_forbidden: true
  allow_write:
    - "experiments/analysis/grasp_hand_graph_pilot/"
    - "experiments/phase1/grasp_hand_graph_"
plan:
  phases:
    - {id: A, name: "開始状態と入力の実在の確認", gpu: false, est: "1 時間"}
    - {id: B, name: "3 クラスの把持塔・4 クラスの手の塔・同じホストの 5 クラスの対照の学習", gpu: true, est: "14〜20 時間"}
    - {id: C, name: "塔の出力（信号）の作成とグラフの作成", gpu: true, est: "2〜4 時間"}
    - {id: D, name: "グラフの interface の腕を W1・W2・W3 で学ぶ", gpu: true, est: "1〜3 時間"}
    - {id: E, name: "集計・報告・PR", gpu: false, est: "2 時間"}
  gates:
    - {id: G1, after: A, check: "起点に前提の道具と材料があり、andrew に本契約以外の compute が無く、保存先の空きが足りる", on_fail: stop}
    - {id: G2, after: B, check: "三種の塔が収束規則で止まり、選んだ回の val の mask mAP が学習前の値を上回り、左右反転でラベルが入れ替わっている", on_fail: stop}
    - {id: G3, after: C, check: "正解の腕のグラフが注釈と一致し、学習前の出力が全腕で塔単独と一致し、陽性対照で変わる", on_fail: stop}
    - {id: G4, after: D, check: "表の全本が収束規則で終わり、記録がそろっている", on_fail: stop}
  env:
    venv: ".venv"
    preflight: [venv_active, gpu_free]
  resources: {server: andrew, gpu: 2, est_hours: 30, runs: 103}
outputs:
  must_have: [REPORT.md, RESULT.md, result.yaml, audit.md]
  destination: "experiments/analysis/grasp_hand_graph_pilot/"
  acceptance:
    - "a: 開始状態（分岐、起点、前提の道具の在否、未追跡、compute プロセスの一覧、保存先の空き、試験の失敗の名前、既存の仮想環境の要約値、GPU ごとの電力の上限）が記録されている"
    - "b: 3 クラスの把持塔 G3 の 3 本（確定と交差適合の半分 H1・H2）、4 クラスの手の塔 H4 の 3 本、5 クラスの把持塔の対照 G5r の 1 本が SPEC の学習設定と止め方で学ばれ、epoch ごとの val の mask mAP とクラス別 AP、止まった回、選んだ回、所要が記録されている"
    - "c: 左右反転でラベルが入れ替わることが、G3 と H4 の両方で、入れ替えない写しとの対照つきで示されている"
    - "d: G3 の器具 3 クラスの AP と G5r の器具 3 クラスの AP が並べてあり、bengio の G の値は参考として別欄にある"
    - "e: 信号（G3・H4 の出力）が train は交差適合の半分から、val は確定の塔から作られ、要約値・フレーム数・被覆が目録に記録されている"
    - "f: グラフが SPEC §4 の定義どおりに作られ、正解の腕のグラフの持ち手が注釈と一致し、腕ごとの節と特徴の在否が SPEC §5 の表と一致している"
    - "g: 腕の全本が SPEC §5 の表どおりに収束規則で回り、学習前の出力が全腕で塔単独と一致し、最良の回と最後の回の val の確率が保存されている"
    - "h: 同じ W・同じ設定の中の差が SPEC §7 の読み方で表にあり、6 工程の Jaccard、frame accuracy、工程別、動画ごとが並んでいる"
    - "i: test の動画 04・05・07 を塔の学習・信号の作成・グラフの作成・腕の学習・評価のどこにも通していないことが、各段で通した動画の集合で示されている"
    - "j: 前回までの予備測定の出力と保存先の既存の中身、data の raw と external と注釈、凍結した塔、既存の checkpoint、third_party、既存の仮想環境を変えていない。試験の失敗が増えていない"
    - "k: PR が Draft でなく存在し、base が phase0、分岐が feat/grasp-hand-graph-pilot"
  report_to: [notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "andrew に本契約以外の compute プロセスがある場合（止めずに利用者に諮る）"
    - "前提の道具・材料（SPEC §1.3）が起点や保存先に無い場合"
    - "塔の学習が発散する、または上限の 36 epoch で止まらない場合"
    - "塔の選んだ回の val の mask mAP が学習前の値を上回らない場合"
    - "グラフの interface を、既存の道具の既定の挙動や third_party を変えないと実装できない場合"
    - "保存先の空きが足りない場合"
    - "実行基盤が書き込み、移動、削除、外部の取得を拒む場合"
