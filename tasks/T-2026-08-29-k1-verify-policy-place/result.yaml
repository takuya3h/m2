issuer_defects:
  - type: asserted_without_measuring
    note: "SPEC §1 が記録上の証跡経路を experiments/transfer/ 配下の t1a_frozen_src_* と断定したが、現物は experiments/_orphan_no_metrics/transfer/ にある。指示どおり experiments/transfer/ を見ると六 run は一件も見つからず、実在しないと誤って結論しうる"
