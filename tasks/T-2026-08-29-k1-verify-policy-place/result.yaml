    note: "SPEC §0 が遡れない理由を「run 名が t1a_frozen_src 系で、かつ lecun の run が索引に未収穫だから」と推定したが、実際の理由は metrics.json 等の完全な不在である。指示どおり収穫の欠落を疑うと、収穫器が走査すらしない run を収穫できない理由の追跡に時間を費やす"
  - type: self_contradiction
    note: "governance.decisions_required に「追跡外 run を索引へ収穫するか」を置いたが、SPEC §3 A-3 と §6 禁止 2 が本文で既に「収穫しない」と答えている。指示どおり実行すると L3 の P6 が FAIL し、本文が答えている問いで実行が止まる。T-2026-08-26-lovo-decision-rule で提案済みの規約と同型の再発である"
  - type: check_does_not_check
    note: "SPEC §4 の検算器の対照は陽性を「既知の値（relationdetr 側の平均 acc）が再計算で一致すること」と定めたが、再計算の入力となる seed 別 acc は run にも記録側にも存在しない。指示どおりに組むと陽性対照が定義できず、陰性だけの片方向の対照になる"

positive_controls:
  - judgement: "K1 照合の検算器（記録値の再計算）が働いていること"
    breaking_input: "paired 差 3 件から seed を一つ除いて平均を取る（集計が seed 数に感応するなら一致しなくなるはず）"
    observed: "3 通りとも不一致。除外後の平均は -0.075550 / -0.067300 / -0.064350 で、記録 -0.06909 の伝播区間から外れた。加えて paired#3 を -0.0300 に差し替えた 4 通り目も -0.052900 で不一致。陽性側は mean(paired)=-0.069067 が伝播区間 [-0.069117,-0.069017] 内で一致した"
  - judgement: "検算器が sigma の系統（ddof）に感応していること"
    breaking_input: "同じ入力に ddof=1 の標本標準偏差を使う"
    observed: "ddof=1 では +0.011610（区間 [+0.011555,+0.011666]）となり記録 0.00949 と不一致。ddof=0 では +0.009480（区間 [+0.009434,+0.009526]）で一致した。記録の系統は pstd と確定"
  - judgement: "分母 0.8986 の同定が数値の一致だけで足りるかの検査"
    breaking_input: "同じ description の 55 行から作れる 3 件組 26235 通りを全数で当て、0.8986 になる組を数える"
    observed: "277 通り（1.06%）が 4 桁表示で 0.8986 になった。数値の一致は一意な同定にならないと判明したため、001/002/003 の同定は「連番の最初の 3-seed 組」という根拠に依存すると明記した"
  - judgement: "禁止領域（experiments/ data/ runindex/）へ触れていないことの検査"
    breaking_input: "同じ絞り込みを、実際に変更のある docs/ へ当てる"
    observed: "runindex/ 等への該当は 0 件、docs/ への該当は 2 件（A7 と stage0_summary）。検査は空振りしていない"
  - judgement: "記録値がリポジトリ内の他所に残っていないことの走査"
    breaking_input: "語境界を外して単独の数値で検索する（部分一致が大量に出るはず）"
    observed: "0.8986 単独では 1188 ファイルが該当した。語境界と対の同時出現へ絞ると 3〜14 ファイルまで落ち、SPEC.md を除く全件が学習 loss や bbox 座標列であることを目視で確認した"
  - judgement: "六 run が隔離前に記録された当の run であることの照合"
    breaking_input: "六つの md5 が互いに一致すれば複製であり、記録と食い違えば別物である"
    observed: "現物 6 件の md5 は t2_ckpt_inventory.csv の記録と 6/6 一致し、六つは互いにすべて異なった。移動であって差し替えでも複製でもない"

