    note: "完了判定 d が陰性対照の空振り確認を『効果を人為的に大きくすれば検出されるはず』と書くが、対の差を定数倍しても |m|/SE は分子と分母が同じ倍率で動くため一切変わらない。指示どおり x10 と x50 を当てた結果、3 則すべてが False のまま動かず、壊れた則と正しい則を区別できなかった。平行移動で境界をまたぐまで掃引して初めて R0 が +0.0732、R1 が +0.1102 で反転することを測れた"
  - type: asserted_without_measuring
    note: "第 1 節が『任意の二つの fold は十三動画を共有するのだから fold の間には強い正の相関がある』と前提として断定するが、実測した相関は中央値 0.029・最大 0.129 と小さい。学習側の重なりが大きいことと、二つの腕の対の差が強く相関することは別である。共通に乗る成分の多くは引き算で消える。この断定に従って補正の強さを決めると過大になる"
  - type: asserted_without_measuring
    note: "第 0 節が『計算はすべて既存の結果の読み取りと再集計である』と断定するが、fold ごとの素の値はリポジトリのどこにも保存されておらず、名前でも内容でも零件だった。実際には読み取り専用スクリプト 16 本の再実行と、R2 のための反復 LOVO に合計およそ 6 時間の計算を要した。申し送り 1 は素の値の有無を未確認としており、第 0 節の断定と食い違っている"

