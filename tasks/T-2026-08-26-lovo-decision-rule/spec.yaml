    - "f 乱数を使う手続きは種が固定され、二度走らせて一致することが実測されている"
    - "g すべての既存結論に同じ則が当てられ、判定が変わったものと変わらなかったものが一覧になっている"
    - "h 効果量と符号の個数が、判定とは別に記録されている"
