spec_version: 2
meta:
  task_id: "T-2026-08-29-lecun-detector-env-pd"
  kind: exp
  title: "lecun への検出器環境の用意と、P→D 四段・B2・B4 の実施"
  origin: claude-app
  chat_url: ""
  created_at: "2026-08-29T15:00:00Z"
  created_from:
    runindex_commit: "09fdefb3"
    counts: {index: 1250, experiments: 277, verdicts: 1486}
  depends_on: ["T-2026-08-29-stage0-contract-b"]
  amendments:
    - date: "2026-08-29"
      reason: "利用者から decisions_required の 1 件へ回答を得た。検出器の実装は版管理下の third_party_snapshot/lecun から復元する（upstream https://github.com/xiuqhou/Relation-DETR.git の commit b485955c72452788240600da6d0f0b8cc49f33c7 を clone し upstream_mods.patch と project_files.tar.gz を適用）。あわせて clone / PyPI / torchvision 重みの外部取得を許可された。いずれも認証を伴わない"
      diff: "governance.decisions_required を 1 件から空へ"
intent:
  question: "lecun に検出器の実装と環境を規約どおり用意し、前契約で欠落により測れなかった P→D 四段・B2・B4 を実施できるか"
  decision_at_stake: "関門 G0 の残る片方向を成立させ、G1.5 の暫定材料を得られるか"
  hypothesis: "P→D の参照入力段でも、正解と予測の結合段は空段を上回る"
  related:
    backlog: []
inputs:
  denominator:
    ref: "exp:phase1/s4_phase_baseline/frozen_tecno_phase_baseline@val~relation_detr_seed42"
    metric: "phase_accuracy"
    require: {n_seeds: ">=3", sigma: present, split: val}
  frozen_source:
    ref: "run:baselines/s0_016_relationdetr_bbox_seed42"
    verify: ckpt_sha256
  data:
    dataset: "hts_ego"
    split_files: ["data/splits/ego_train.txt", "data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints: ["Makefile"]
contract:
  inject_verbatim:
    - conventions#split
    - conventions#eval_recipe
    - conventions#frozen_source
    - conventions#sigma
    - conventions#prohibitions
    - conventions#issuer_cautions
    - conventions#naming
  conventions_rev: "a8c07e81"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_estimated_values, no_runindex_hand_edit]
  verbatim_forbidden: true
plan:
  phases:
    - {id: A, name: "環境の用意（検出器実装・venv・外部重み）と所在の実測、prereg の commit", gpu: false, est: "medium"}
    - {id: B, name: "P→D 参照入力四段（一 seed）と B2 送り手評価", gpu: true, est: "long"}
    - {id: C, name: "強い工程塔の構築と D→P 四段（B4・暫定）", gpu: true, est: "long"}
    - {id: D, name: "収穫・検査・送出", gpu: false, est: "short"}
  gates:
    - {id: G1, after: A, check: "検出器が凍結源 ckpt を読み込み前方計算できることを実測し、B4 の重みの所在が確定し、prereg が学習開始前に commit されている", on_fail: stop}
    - {id: G2, after: B, check: "P→D 四段と B2 が揃った、または実施不能の理由が資産単位で確定した", on_fail: ask}
  env:
    venv: ".venv"
    preflight: [venv_active]
prereg:
  prediction: "prereg.md の予測節に同文を記す。方向のみを登録し、効果量は登録しない"
  primary_endpoint: "P→D で参照入力四段の主指標（mAP）が測定として揃い、B2 の mAP 差が得られ、B4 の四段と塔単体性能が揃うこと"
  decision_rule: "本契約の数値では仮説の採否を判定しない。関門 G0 の残る片方向（P→D）の成立を問う。数値は Stage 1 設計の材料とする"
  stop_conditions:
    - "検出器が凍結源 ckpt を読み込めない、または前方計算が再現しない場合"
    - "一 run の学習が六時間を超える見込みになった場合"
    - "環境構築が認証を伴う外部取得を要する場合"
    - "分母または凍結源の参照が索引で解決できない場合"
  committed_at: null
  commit: null
outputs:
  expected_runs: 17
  must_have: [metrics.json, notes.md, config.yaml]
  destination: "experiments/transfer/"
  stamp: {task_id_in: config.yaml}
  acceptance:
    - "SPEC の完了判定 a から f をすべて満たし、各判定に空振りでないことの確認が付く"
    - "P→D 四段が揃うか、揃わない場合は資産単位で理由が確定している"
    - "PR が存在する状態で終える"
  report_to: [notion_task_distribution, notion_run_ledger]
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if:
    - "denominator_moved"
    - "frozen_source_hash_mismatch"
    - "検出器の環境構築が外部への新規通信（認証を伴う取得）を必要とし、利用者の許諾が要る場合"
    - "P→D の入力経路の新設が、入力適合層と界面の追加という W1 の範囲を超える改変を要する場合"
