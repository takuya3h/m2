followups:
  - >-
    結論は「捨てる」。正解を渡した腕（上限）が比 1.4729 で判定を満たさず、点推定 +0.0016832 は
    1515 フレーム中 2.55 フレームに相当する。実際に使える形（推論した値）は −0.0003190 で実質零。
    符号が正の種は 33/60 でほぼコイン投げ。信号を工程分類へ渡す機構について、これ以上の腕や形を
    試す根拠は無い。ただし「効果が無いと証明した」のではなく「上限が 60 種で見える大きさより
    小さい」を示したのであり、この区別を次の契約へ引き継ぐこと。
  - >-
    観測された平均 +0.0016832 を比 2 で検出するには種が 111 個要る（現在 60）。検出できても
    2.55 フレームである。種を増やす前に、種によって差が ±0.02 振れる不均一の源を特定するか、
    測る側を accuracy から変えることを検討すべきである。accuracy の量子化幅 1/1515 = 0.00066 に
    対して効果が小さすぎる。
  - >-
    事前登録の検出力の見込みは、別の腕で測った散らばりを主たる腕へ流用したために外れた
    （0.0054519 と見込んで実測 0.0088520）。今後 exp 契約で検出力を見込むときは、
    「どの対の差で測った散らばりか」を明示し、腕が違えば流用しないこと。
  - >-
    工程ごとの分解では dressing が両腕とも F1 = 0（支持数 24）。モデルはこの工程を一度も
    当てていない。disinfection と irrigation は val に支持が無い。工程認識の評価を
    macro F1 で語るときはこの三工程の扱いを明示する必要がある。
  - >-
    把持の推論そのものは曲線下面積 0.70〜0.89、two_hands_tool の平均適合率は 0.5587。
    工程分類への注入には足りないが、それ自体の課題としては測れている。別の用途で見直す価値がある。
  - >-
    ExperimentManager の採番に競合の窓がある（next_sequence で走査してから
    mkdir(exist_ok=False)）。本契約は起動間隔と再試行で回避したが、並行実行が常態化するなら
    採番を原子的にする impl 契約を立てるべきである。

  - >-
    make forbidden-check が fail を返すが契約違反ではない。違反 2932 件は experiments/ の新規
    360 run（本契約の成果物。outputs.destination が experiments/）と runindex/ の再生成
    （禁止 1 は手編集を禁じ生成は可。Phase B Step 5 が make runindex を指示）の二種類のみで、
    既存 run の変更・削除は git diff で M も D も 0 件。道具が生成物として除外するのは
    context/auto/ と tasks/inbox.md だけで、kind: exp の契約が run を作ることも make runindex が
    runindex/ を作り直すことも知らない。**exp 契約でも使える形に道具を直す impl 契約が要る。**
  - >-
    索引の集約が決定化の有無を混ぜている。experiment_id に task_id が入らないため、本契約の
    360 本（決定化あり）が前の契約の 66 本（決定化なし）と同じ 6 実験行に集約された
    （ctrl と inj は 73 本、残り四つは 70 本）。本報告の解析は task_id で絞っているため影響は
    無いが、experiments.csv のこれらの行を条件照合に使うと決定化の有無が混ざった集約を見る。
    集約の鍵に決定化の有無を含めるか、少なくとも混在を検出して警告すべきである。

