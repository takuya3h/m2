issuer_defects:
  - type: check_does_not_check
    note: >-
      本契約は測定を厳密にすることが主題であるのに、plan.env.preflight に deterministic_flags が
      無く、プリフライトの P3 deterministic_flags は SKIP になった。指示どおりプリフライトを回しても
      決定性は一切検査されない。実際に走らせると 6 PASS / 1 WARN / 2 SKIP / 0 FAIL で通るが、
      決定化が効いていない状態でも同じ結果になる。実行者が G1 で実挙動により確かめた。
  - type: asserted_without_measuring
    note: >-
      「一本およそ十五秒である。三百六十本でおよそ九十分」は andrew の測定値を他ホストへ当てたもの。
      lecun の実測は通常腕 33.11〜33.86 秒、段階を分ける腕 47.40 秒、実時間の平均 41.66 秒で、
      360 本に 2.09 時間かかった。指示どおり 90 分で終わる前提で計画すると、装置の占有見積りが
      3 倍近く外れる。
  - type: asserted_without_measuring
    note: >-
      事前登録の「六十の種で 0.0014 級まで見える見込み」は、前の契約が別の腕の対の差で測った
      母標準偏差 0.0054519 を主たる差へ流用したものだった。正解を渡す腕と無情報な腕の対の差の
      実測は 0.0088520（1.62 倍）で、達成された 2SEM は 0.0022856 である。指示どおり六十で止めると、
      見込んだ検出力に届かないまま終わる。実際に比 1.4729 で不成立となった。
  - type: self_contradiction
    note: >-
      SPEC の判断表は「上回らない → 機構そのものに価値が無い。設計を捨てる」と書く一方、prereg.md は
      「判定に届かず、かつ平均の大きさが算出した値を下回る場合、『検出できなかった』と述べる。
      『効果が無い』とは述べない」と書く。実測はまさにこの場合（比 1.4729、平均 0.0016832 <
      2SEM 0.0022856）で、SPEC の表をそのまま当てると事前登録の禁止を破ることになる。
      本報告は事前登録を優先し、判断は表に従って「捨てる」、述べ方は事前登録に従った。

