followups:
  - >-
    keeper.sh:28 と m2-sync.sh:10 の M2DIR が repo の位置を二択でしか解決しない。
    本ホスト（~/local/m2）では解決に失敗し、.stignore の自動反映も分岐の自動統合・push・Draft PR も
    働かない。本契約では .stignore を手で置いて凌いだが、次に phase0 の .stglobalignore が変わっても
    本ホストへは届かない。解決を三択以上にするか、.servername と同じ方式で位置を外から与えるかの判断が要る。
  - >-
    告知と外部の中継を無効にしても options/natEnabled が既定 true のままで、起動時に公開の STUN へ出る。
    本契約では ~/.syncthing.log:1286 に stun.internetcalls.com:3478 経由で外向きの住所を解決した記録が残った。
    外部へ出ないことを目的とするなら natEnabled も無効化の対象に含める必要がある。七台すべてが同じ状態である。
  - >-
    tests/test_loss_mask.py:70 の飛ばし条件が _REAL_LOSS_MASK.exists()、つまりディレクトリの存在だけを見る。
    同期がディレクトリを先に作り中身を後から運ぶため、転送中は飛ばされずに実行されて FileNotFoundError で
    落ちる。同期を使う全ホストで転送中に再現する。必要なファイルの存在を条件にするかの判断が要る。
  - >-
    m2 の同期は本報告の時点で completion 4.16%、残り 98,955,659,512 bytes・212,715 件である。
    SPEC の指示により完了を待っていない。この速さ（約 5 分で 2.15 GB）なら約 4 時間を要する。
    完了後に test_loss_mask の 1 件が解消するか、共有領域と repo の最終的な大きさがいくつになるかは
    別途の確認が要る。容量は足りている（/dev/sdb1 の空き 8,326,007,549,952 bytes）。
  - >-
    本ホストの外向きの住所が依然として確定していない。中継の足元は 172.17.0.12、STUN が解決した外向きは
    131.113.39.33 で、scripts/sync/hosts/ が dlsta に与える 192.168.196.54 とはどちらも異なる。
    中心の側の sshd の記録を読めば確かめられるが、それは中心で命令を実行することになり禁止 1 に当たる。
    中心を実行ホストとする契約で確かめるのが筋である。
  - >-
    抑止の解除を手順書が示す「別名へ移す」で行うと、未追跡ファイルが残る。.gitignore:240 は
    .sync-pause を完全一致で無視するため .sync-pause.released は無視されない。未追跡の放置は
    git merge --ff-only を内容が同一でも失敗させ、自動同期を止める（env-facts の B-30 の実測）。
    本契約では削除が通る環境だったため rm で片付けたが、削除が拒まれる環境では残り続ける。
    .gitignore に .sync-pause* を足すか、解除法を削除優先へ戻すかの判断が要る。

