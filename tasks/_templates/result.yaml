# 完了報告の構造化された対。RESULT.md の散文とは別に、実行者が事実だけを書く。
# **散文を解析して作らない。** 解釈は捏造を生む。
#
# 検証: make task-validate（対が無い契約は失敗にしない）
# 投影: make taskindex → context/auto/tasks_summary.csv と followups.md
result_version: 1
task_id: "T-YYYY-MM-DD-slug"        # ディレクトリ名と一致すること
status: pass                         # pass / partial / stopped
host: ""
branch: ""
pr: null                             # 起票していなければ null
merged: false

# ゲートの判定。verdict は pass / ask / stop / skip
gates:
  - {id: G1, verdict: pass}

# 試験の件数。開始前を先に測ること。
tests:
  before_failed: 0
  after_failed: 0
  after_passed: 0

deviations: 0                        # 逸脱の件数

# 起票者の誤り。type は 4 種に固定。**空にしない。**
# 無かった場合は [] とし、無かったことを RESULT に書く。
#   check_does_not_check       検証コマンドが対象を検証していない
#   asserted_without_measuring 確かめずに断定した
#   self_contradiction         契約の内部で矛盾した
#   shell_assumption           実行環境と異なるシェルを前提にした
issuer_defects: []

# 申し送りの本文。要約しない。
followups: []

# 断定できなかった事項。status が pass 以外ならここか followups に理由を置く。
unknowns: []

commits: []
