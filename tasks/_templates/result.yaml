# 完了報告の構造化された対。RESULT.md の散文とは別に、実行者が事実だけを書く。
# **散文を解析して作らない。** 解釈は捏造を生む。
#
# 検証: make task-validate（対が無い契約は失敗にしない）
# 投影: make taskindex → context/auto/tasks_summary.csv / followups.md / results_recent.md
#
# 版 2 は中身を持つ。件数だけでは「何が誤っていたか」が伝わらず、読む側が
# 散文を人手で転記するしかなかったため広げた。**版 1 の過去の報告は直さない。**
#
# 版 3 は陽性対照の記録を要求する。判定が通ったことは、その判定が働いていることを
# 意味しない。**空振りかどうかは判定の外から確かめるしかない。**
# 版 3 は版 2 の要件をすべて含む。**版 1 と版 2 の過去の報告は直さない。**
result_version: 3
task_id: "T-YYYY-MM-DD-slug"        # ディレクトリ名と一致すること
status: pass                         # pass / partial / stopped
host: ""
branch: ""
pr: null                             # 起票していなければ null
merged: false

# ゲートの判定。verdict は pass / ask / stop / skip
# note には **何を実測したか** を書く。ゲートの文言を写さない。版 2 では必須。
gates:
  - {id: G1, verdict: pass, note: ""}

# 試験の件数。開始前を先に測ること。
tests:
  before_failed: 0
  after_failed: 0
  after_passed: 0

# 逸脱の一覧。**空にしない。** 逸脱が無い場合も、その旨を 1 件書く。
# type は 3 種に固定。列挙にない型が要るときは完了時に提案として報告し、勝手に増やさない。
#   spec_defect   契約の誤りによる
#   environment   実行環境の差による
#   judgement     判断が必要だった
deviations:
  - {type: judgement, note: ""}

# 起票者の誤り。type は 4 種に固定。**空にしない。**
# 無かった場合は [] とし、無かったことを RESULT に書く。
#   check_does_not_check       検証コマンドが対象を検証していない
#   asserted_without_measuring 確かめずに断定した
#   self_contradiction         契約の内部で矛盾した
#   shell_assumption           実行環境と異なるシェルを前提にした
#
# note は **何が誤っていたか** と **指示どおり実行すると何が起きたか** の 2 つを含む。
# 版 2 では 80 字以上。結果を書かない記述を拒むための下限であって、字数を稼ぐためではない。
issuer_defects: []

# 主要な判定が空振りでないことの確認。**版 3 では必須で、空にしてはならない。**
# breaking_input は「何を入力すればこの判定が失敗するはずか」（期待）。
# observed は「実際に何が起きたか」（実測）。測っていない場合は UNKNOWN と書く。
#   - judgement: "判定 4 検査が教師データを検出する"
#     breaking_input: "規則を 1 つ外す"
#     observed: "検出が 11/16 から 10/16 へ落ちた"
positive_controls: []

# 申し送りの本文。要約しない。
followups: []

# 断定できなかった事項。status が pass 以外ならここか followups に理由を置く。
unknowns: []

commits: []
