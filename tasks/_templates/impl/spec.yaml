spec_version: 2
meta:
  task_id: "T-YYYY-MM-DD-slug"
  kind: impl
  title: ""
  origin: claude-app
  chat_url: ""
  created_at: "YYYY-MM-DDTHH:MM:SSZ"
  created_from:
    runindex_commit: ""
    counts: {index: 0, experiments: 0, verdicts: 0}
  depends_on: []
  amendments: []
intent:
  question: ""
  decision_at_stake: ""
  related:
    backlog: []
inputs:
  data:
    dataset: ""
    split_files: ["data/splits/ego_val.txt"]
  caches: []
  code:
    entrypoints: []
contract:
  inject_verbatim: [conventions#prohibitions, conventions#naming]
  conventions_rev: ""
  prohibitions: [no_split_redefine, no_raw_write, no_estimated_values]
  verbatim_forbidden: true
  # 契約が正当に書く禁止領域があれば接頭辞で宣言する（無ければ欄ごと消す）。
  # 宣言の無い禁止領域への書き込みは失敗する。検査は make forbidden-check（--task つき）。
  # **上限**: data/ 配下は宣言しても許可されない。experiments/ と transfer/ は
  # 起点に既に存在する経路（既存 run 配下）を許可できない。
  # allow_write: [runindex/]
plan:
  phases:
    - {id: A, name: "", gpu: false, est: ""}
  env:
    venv: ".venv"
    preflight: [venv_active]
outputs:
  must_have: [notes.md]
  destination: "tools/"
  acceptance: []
  report_to: []
governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: []
