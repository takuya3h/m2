issuer_defects:
  - type: self_contradiction
    note: >-
      SPEC の表は keeper.sh 39〜50 行を「同期処理の監視、除外規則の反映、版管理の同期 → これを動かす」
      と書くが、実装の 41〜43 行は監視ではなく起動である。ilya では [ -x ~/bin/syncthing ] と
      ! pgrep -x syncthing の両条件が真であり、指示どおり起動すれば一周目で必ず
      nohup ~/bin/syncthing serve --no-browser が走る。これは禁止 2「同期処理を起動する」、
      完了判定 11「同期処理が零件」、G2（on_fail: stop）と正面から衝突する。41 行の注釈は
      「未インストールならスキップ」と書くが、SPEC 自身が「五台すべてで同期処理の実体が揃い」と
      述べており、起票者は実体があることを知りながらスキップ条件に頼っている。
  - type: shell_assumption
    note: >-
      Task 2 Step 2 は sh -n を指示し「両方が零であること。構文誤りのまま起動すると常駐処理が
      即座に落ちる」と書く。しかし /bin/sh は dash であり、m2-sync.sh は #!/bin/bash で始まり
      75 行でプロセス置換 <(...) を使うため、sh -n は exit 2 と偽の構文誤りを出す。指示に忠実な
      実行者はここで配置が壊れていると読んで停止する。実際は正本も配置も正しく bash -n では両方 0。
      SPEC の「全台で確定した事実」は対話シェルが zsh であることは書くが sh が dash であることを
      書いていない。他の四台でも同じことが起きる。
  - type: check_does_not_check
    note: >-
      Task 3 Step 4 は ls -la ~/.keeper.lock だけで「錠が作られていること。これで二重起動が
      防がれる」と結論するが、存在は働きを意味しない。exec 9>~/.keeper.lock は flock が
      壊れていてもファイルを作るため、この検査は錠が機能しなくても通る。実際に二度目を起動して
      件数も pid も変わらないことを確かめて初めて防止を主張できる。

