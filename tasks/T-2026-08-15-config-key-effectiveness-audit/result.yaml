issuer_defects:
  - type: asserted_without_measuring
    note: >-
      SPEC が「過去の run は 851 件ある。その記録が条件を正しく表しているかを確かめる」と書いたが、
      851 は index.csv の行数であって config.yaml を持つ run は 677 件しかない。指示どおり 851 件の
      記録を照合しようとすると、config.yaml を持たない 63 件（_aborted_* / _failed_* 配下）に対して
      照合対象が存在せず、件数が合わない。実測では監査対象キーが現れる run は最大 602 件だった。
  - type: asserted_without_measuring
    note: >-
      SPEC が Phase B Step 2 で「非決定の大きさは並行する契約で測られている。本契約では同じ設定で
      二度走らせた差を先に測り、それを判定の基準にすること」と書き、揺れがある前提を置いていた。
      実測すると CPU・seed 固定で 18 指標すべて max_abs_diff=0.0 の完全決定であり、揺れは存在しない。
      指示どおり並行契約の測定値を待って基準にすると、実際より緩い閾値で判定するところだった。
  - type: self_contradiction
    note: >-
      SPEC は「設定に現れるのに実装から読まれていない項目はどれか」を一意に決まる問いとして書き、
      四つの区分も鍵ごとに一つ決まる前提で組まれている。しかし実装では読まれるかが (鍵, 入口) の
      組で決まる。grasp_inference.signal は元の入口で差 0.0、variants 入口で差 0.0014 と実測され、
      同じ鍵が同時に「読まれない」かつ「読まれる」になる。鍵ごとに一区分を割り当てると必ず誤る。
  - type: check_does_not_check
    note: >-
      SPEC 冒頭の前提コマンドは configs/ を実装の探索対象に含めるが、設定が実際に読まれるかを
      configs/stage/*.yaml で確かめても意味がない。実際の 66 run はその写しを使っており、
      指示どおり configs/stage/ を摂動しても過去の run の条件は 1 件も再現できない。
      command.sh を読むまでこの食い違いは検出できなかった。

