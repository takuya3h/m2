      使った 8 設定（inj 腕は葉キー 40）。実装側は src/egosurgery と scripts の .py 242 ファイルを
      構文木（600 箇所 / 142 経路）と字面（378 箇所 / 127 経路）の二方法で集め、一致 126 経路、
      片側のみ構文木 16・字面 1。食い違いは実装を読んで裁定し、字面側は docstring の cfg.xxx を
      読み取りと誤認していた偽陽性 15 件、構文木側は self.cfg を根と判定できない実装バグで
      self.cfg 経由 174 箇所の取りこぼしと判明。四区分は元の入口で read=25 / unread=14 /
      unread 摂動未実施=1 / impl_only=3 / unknown=0、variants 入口で 26 / 13 / 1 / 4 / 0。
      差が大きい（40 中 14 が未読）ため SPEC の想定外表に従い、Phase B の確認範囲を条件として
      引用されうる高優先度（frozen_source.* / eval_recipe.* / signal / detach_from_phase_loss /
      model.component / train.batch_size / freeze_backbone / data.population.test）に明記して続行した。
  - id: G2
    verdict: pass
    note: >-
      判定の基準として同一設定・同一 seed の 2 回実行の差を先に測り、両入口とも 18 指標すべてで
      max_abs_diff=0.0（完全決定的）を実測した。読まれないと判定した 14 項目は値を変えても
      18 指標が 1 bit も動かず（差 0.0）、対照として読まれる 4 項目（train.lr 0.550279 /
      train.smoothing_weight 0.073610 / grasp_inference.hidden_dim 0.308443 / seed 14.5）は
      すべて変化した。停止条件（読まれる項目でも変わらない）には該当しない。丸ごと渡す経路の
      下で静的に判定できなかった model.temporal.{num_stages,num_layers,num_f_maps,dropout} も
      摂動で全て変化し、read と確定して unknown を 0 にした。

