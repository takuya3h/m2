# ============================================================
# 上限測定専用（oracle）。測る側の教師そのものを注入する。
# 実際に使える手法ではない。**成果として報告してはならない。**
# 注入という機構自体に価値があるかの上限だけを測る。
# ============================================================
# @package _global_
task_id: T-2026-08-15-injection-form-sweep

experiment:
  category: phase1
  step: s4_grasp_injection
  description: frozen_tecno_grasp_inference_inj_oracle_upper_bound_only

seed: 42

frozen_source:
  detector: relation_detr
  seed: 42
  checkpoint: third_party/Relation-DETR/checkpoints/incoming/seed42/best_ap.pth
  cache_dir: data/processed/stage1_features/relation_detr_seed42

model:
  component: grasp_phase_injection
  input_dim: 2048
  num_phases: 9
  temporal:
    num_stages: 2
    num_layers: 8
    num_f_maps: 64
    dropout: 0.5

grasp_inference:
  enabled: true
  arm: inj
  hidden_dim: 64
  num_classes: 5
  signal: oracle_upper_bound_only
  # 明示の承認。これが無いとモデルは構築を拒む。
  oracle_upper_bound_acknowledged: true
  # 教師の無いフレームに渡す埋め値 = 学習側の正例率（零だと「教師が無い」ことが
  # 強い信号として漏れ、正例率 92% の次元では大きく誤った値になる）。
  # 埋め値は 0/1 でないため、教師の有無は依然として区別可能である（漏れは残る）。
  oracle_missing_fill: [0.925502, 0.896323, 0.761971, 0.766994, 0.101753]
  detach_from_phase_loss: true
  annotation_root: data/annotations/egosurgery_hts/hand_tool_seg

train:
  epochs: 50
  lr: 0.0005
  weight_decay: 0.01
  smoothing_weight: 0.15
  grasp_loss_weight: 1.0
  freeze_backbone: true
  batch_size: 1

data:
  phase_manifest: data/processed/phase_manifest
  feature_cache: data/processed/stage1_features/relation_detr_seed42
  population:
    train: 9657
    val: 1515
    test: 4265

eval_recipe:
  protocol_source: PHASE_EVAL_PROTOCOL
  inference_protocol: online_causal
  jaccard_mode: strict

logging:
  wandb_project: egosurgery_multitask
  wandb_enabled: true
