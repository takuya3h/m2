  - type: judgement
    note: >-
      規則を 2 度絞り込んだ。素朴な実装では該当 301 件で、truncation_in_measurement を件数
      指定の無い切り詰めに限って 102 件から 6 件へ、venv 依存の検出を既存実装の
      「分離された source」へ委譲して 151 件から 18 件へ、さらに source が source へ続く場合を
