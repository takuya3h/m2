issuer_defects:
  - type: self_contradiction
    note: >-
      Task 2 Step 4 は「過去の契約が該当するのは正常である（実際に誤りがあったのだから）」と
      述べるが、Task 6 Step 2 は make spec-check を exit 0 にすることを求め、Task 2 Step 2 の
      要件 5 は「契約の識別子を引数に取る。省略時は全契約」を求める。3 つを同時に満たす実装は
      存在しない。指示どおり省略時に全契約を回すと過去の契約 34 件が該当して必ず非ゼロになり、
      自己検証が通らない。TASK 指定で自己検証する読み方を採って解決した。
  - type: check_does_not_check
    note: >-
      Task 1 Step 1 が示す対象の一覧の取り方（ls -1 tasks/*/result.yaml）は雛形
      tasks/_templates/result.yaml を拾う。指示どおり 13 件を教師データにすると、
      issuer_defects: [] の placeholder が分母に入り検出率が薄まる。Step 1 は「両方の件数を
      比べる」「別の探し方でも確かめる」と指示するが、**契約でないものが混ざっていないか**は
      問うていない。3 経路で突き合わせても 3 経路すべてが雛形を拾うため一致し、検査は通る。
  - type: self_contradiction
    note: >-
      Task 4 の Files 欄が tasks/_templates/*/SPEC.md までしか挙げないのに、同 Task の Step 2 は
      対（result.yaml）に項目を足すことを要求する。対の雛形は tasks/_templates/result.yaml に
      あり glob の */ に該当しない。Task 5 も同型で、Files は tools/preflight_task.py と試験だけを
      挙げるが Step 3 は手順書への記述を要求する。指示どおり Files 欄だけを変更すると、
      新様式を示す雛形と 4 層の説明が両方とも欠ける。
  - type: asserted_without_measuring
    note: >-
      SPEC 冒頭が「起票者の検査が検証対象を検証できていない誤りが 20 task 連続で起きている」と
      断定するが、repo から検証できるのは報告（対）を持つ 12 契約までである。契約は 35 件あるが
      23 件は対を持たず、issuer_defects の記録が存在しない。12 件はすべて 1 件以上の誤りを
      持つため「12 連続」までは言えるが、20 の根拠は確認できない。指示どおり 20 を前提に
      読むと、教師データが 20 契約分あると誤解する。実際の教師データは 12 契約の 39 件である。

followups:
  - >-
    files_vs_check の規則を実装できていない（教師データ 2 件: T-2026-08-11-codex-parity#2 と
    T-2026-08-13-implementation-history-index#2）。Files 欄に挙がらないファイルを検査が走査する
    という矛盾を機械で見るには、各検査が「自分が何を走査するか」を返す口が要る。
    check_docs.py の PATHLIKE と check_agent_docs.py の DOC_PATTERNS は定数として持っている
    ため、これを公開する形に揃えれば実装できる。二重管理を作らない設計の続きである。
  - >-
    教師データに記録漏れが 11 件ある。検出器は実在する誤りを見つけたが、過去の報告は
    書き換えない（禁止 8）ため教師データには反映されない。検出率の分母は固定されたままで、
    分子だけが実態より小さく見える。網羅性を上げるには新しい契約の報告を積むしかないが、
    それでは過去の 23 件が永久に空白のままである。扱いの判断が要る。
  - >-
    make spec-check は省略時に全契約を回して非ゼロになる。過去の契約が該当するのは正常だが、
    CI へ入れるなら TASK 必須にするか、起点より新しい契約だけを見る指定が要る。
    現状は Makefile と手順書に「TASK を付けて使う」と書いてあるだけで、機械では強制していない。
  - >-
    host_mismatch は実行対象の契約でのみ意味を持つ。完了した契約を別のホストから走らせると
    必ず該当する（実測: codex-parity は efros を宣言し、lecun では該当する）。
    規則の適用範囲を実装で絞る方法は決めていない。現状は手順書の記述に頼っている。
  - >-
    docs-reconciliation#2 の型（判定が空振りかを問わない）は規則にせず様式で防いだ。
    様式は spec_version 2 以降にしか効かないため、既存の版 1 の契約 34 件ではこの型は
    検出されない。過去の契約を検査対象にするなら別の手段が要る。

