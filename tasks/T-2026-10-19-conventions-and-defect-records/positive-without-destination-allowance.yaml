  - id: B
    name: 規約 symmetry に入力の縮小規則とホストの行を足す
    gpu: false
    est: 30m
  - id: C
    name: 規約に数値精度の節を足す
    gpu: false
    est: 40m
  - id: D
    name: 規約 folds と crossfit の記述を実測に合わせ、変更履歴に行を足す
    gpu: false
    est: 30m
  - id: E
    name: 折り表の正本に追加動画の注記を足す
    gpu: false
    est: 15m
  - id: F
    name: 環境の到達性の記述と、起票者の欠陥の記録を直す
    gpu: false
    est: 40m
  - id: G
    name: 検証と報告
    gpu: false
    est: 60m
  gates:
  - id: G1
    after: A
    check: 分岐が feat/ で始まり起点が origin/phase0 で、作業ツリーが他の契約の分岐ではなく、装置を使わないことと試験の前の値を記録した
