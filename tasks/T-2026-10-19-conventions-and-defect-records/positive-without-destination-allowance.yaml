  - id: G2
    after: D
    check: 規約の節ごとの要約値で、変わった節が symmetry と folds と crossfit と naming（変更履歴を含む）と新しい precision
      だけで、すべてのアンカーが解決し、提案カードの検査の結果が前後で同じ
    on_fail: stop
  env:
    venv: .venv
    preflight:
    - venv_active
outputs:
  must_have:
  - RESULT.md
  - result.yaml
  - audit.md
  destination: tasks/T-2026-10-19-conventions-and-defect-records/
  acceptance:
  - 'a: 規約 symmetry の各塔の構造の標準の処方に、入力の縮小規則が使える行として、画面の残る割合を揃える条件と切り出しを使えない行とともに足され、SPEC
    5.1 と一行ずつ突き合わされている'
  - 'b: 規約 symmetry にホストと装置型が必ず置く行として足され、ホストの規則と出所が SPEC 5.2 と一致する'
  - 'c: 規約に新しい節 precision が在り、界面の学習と検出塔の学習の精度、採用の条件、出所が SPEC 5.3 と一致し、各行の出所が repo
    の文書の中で確かめられている'
  - 'd: 規約 folds の追加動画の記述が 17 から 21 の 5 本と P-20 の名に合わせられ、正本の折り表にも同じ注記があり、識別子 6 本と重複
    0 件の記録は残っている'
  - 'e: 規約 crossfit の工程塔と検出塔の送り手の差の記述が実測に合わせられている'
  - 'f: 規約の変更履歴に本契約の行があり、変わった節が意図した節だけであることが節ごとの要約値の前後で示されている'
  - 'g: 環境の記録の到達性の記述が、元の測定の範囲と 2026-10-17 の実測を分けて書かれ、新しい接続をしていない'
  - 'h: 起票者の欠陥の記録に SPEC 5.7 の 5 件が、型と出所と対処つきで足されている'
  - 'i: 本契約で装置を使っておらず、data 配下に書いておらず、ほかのホストに接続していない'
  - 'j: PR が Draft でなく存在し、base が phase0 で、分岐が feat/conventions-and-defect-records'
  report_to:
  - notion_run_ledger
governance:
  decisions_required: []
  deviations_required: true
  integrity:
  - no_fabrication
  - unknown_if_unmeasured
  escalate_if:
  - 本ホストの repo の位置や起点が env-facts.md の記載と食い違う場合
  - 作業ツリーが別の契約の分岐にある、または別の契約が作業ツリーを使っている場合
  - 規約に置く行の出所が、SPEC が挙げる repo の文書の中に見つからない場合
  - 規約の文言を整えるときに、範囲・条件・数を変えたくなった場合
  - 実行基盤が書き込みや移動を拒む場合
