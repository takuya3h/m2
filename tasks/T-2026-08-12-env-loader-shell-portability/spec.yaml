spec_version: 1

meta:
  task_id: "T-2026-08-12-env-loader-shell-portability"
  kind: impl
  title: "資格情報の読み込みを対話シェルでも成立させ、外部記録の停止期間を測る"
  origin: claude-app
  created_at: "2026-08-12T12:00:00Z"
  created_from:
    runindex_commit: "12cc0e8"
    counts: {index: 749, experiments: 206, verdicts: 1038}
  depends_on: ["T-2026-08-11-canonical-index-refresh"]
  amendments: []

intent:
  question: "資格情報の読み込みがどのシェルでも成立し、外部記録の停止期間を特定できるか"
  decision_at_stake: "読み込み経路を仕組みで直すか、迂回を続けるか"
  related:
    backlog: []

inputs:
  data:
    dataset: "egosurgery_phase_v1"
    split_files: ["data/splits/ego_val.txt"]
  code:
    entrypoints: ["tools/harvest_runindex.py"]

contract:
  inject_verbatim: [conventions#prohibitions, conventions#env_p0]
  conventions_rev: "d422b08"
  prohibitions: [no_split_redefine, no_raw_write, no_frozen_change, no_runindex_hand_edit, no_estimated_values]
  verbatim_forbidden: true

plan:
  phases:
    - {id: A, name: "誤解決の再現と原因の特定", gpu: false, est: "30m"}
    - {id: B, name: "シェルに依存しない解決への修正", gpu: false, est: "40m"}
    - {id: C, name: "同型の書き方を持つ他の入口の調査", gpu: false, est: "30m"}
    - {id: D, name: "外部記録の稼働状況の実測", gpu: false, est: "40m"}
  gates:
    - id: G1
      after: A
      check: "対話シェルで失敗し別のシェルで成功することを再現し、原因を実装から特定した"
      on_fail: stop
    - id: G2
      after: B
      check: "両方のシェルで資格情報が読み込まれることを実行して確認した"
      on_fail: stop
    - id: G3
      after: D
      check: "外部記録の直近の投稿時刻を実測し、停止の有無を記録した"
      on_fail: ask
  env:
    venv: ".venv"
    preflight: [venv_active]

outputs:
  must_have: [RESULT.md]
  destination: "scripts/"
  acceptance:
    - "対話シェルから読み込みが成立する"
    - "別のシェルからも従来どおり成立する"
    - "同型の書き方を持つ他の入口が調査されている"
    - "資格情報の値が出力にも記録にも含まれない"
    - "外部記録の直近の投稿時刻が実測されている"
    - "make task-validate が exit 0"
    - "make task-preflight が exit 0"
  report_to: []

governance:
  decisions_required: []
  deviations_required: true
  integrity: [no_fabrication, unknown_if_unmeasured]
  escalate_if: [secret_value_printed, encrypted_env_modified]
