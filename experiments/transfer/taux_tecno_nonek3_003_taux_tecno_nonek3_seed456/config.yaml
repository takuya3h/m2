experiment:
  category: transfer
  step: taux_temporal
  description: taux_tecno_nonek3
seed: 456
frozen_source:
  detector: relation_detr
  seed: 42
  backbone: resnet50
  gap_cache: data/processed/stage1_features/relation_detr_seed42
  region_cache: data/processed/t1a_regiontoken/relation_detr_seed42
method:
  name: taux_region_to_phase_temporal
  system: ②feature_level/object-token
  ref: TAPIS/GraSP (MedIA 2025); TeCNO (MICCAI 2020); minGRU (arXiv:2410.01201); Mamba
    (arXiv:2312.00752)
  direction: det->phase
  coupling: regiontoken_concat_gap
  region_repr: per_class_256d_score_weighted
  region_dim: 3840
  temporal_kernel: tecno
  temporal_feature: none
  temporal_k: 3
  temporal_target: region
  add_toolpresence: false
  toolpresence_source: null
  neck: null
  grad_crossing: false
model:
  temporal_head: tecno
  num_stages: 2
  num_layers: 8
  num_f_maps: 64
  in_dim: 5888
  num_phases: 9
  causal: true
train:
  epochs: 50
  lr: 0.0005
  weight_decay: 0.01
  freeze_backbone: true
  smoothing_weight: 0.15
data:
  n_train_clips: 13
  n_val_clips: 3
delta:
  phase_denominator: s4_phase_baseline (frozen_tecno_phase_baseline)
  denominator_value_lecun: 0.8986±0.0028
  note: Δ_phase = (T-aux − S4 base 0.8986±0.0028). 問いB は temporal_feature=none 固定で
    kernel を変え、問いA は temporal_kernel=tecno 固定で feature を変える（核と時間加工を交絡させない）。
server_name: efros
