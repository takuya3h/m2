dataloader:
  evaluator: {_target_: detectron2.evaluation.COCOEvaluator, dataset_name: '${..test.dataset.names}', output_dir: /tmp/mrdetr_dino_work}
  test:
    _target_: detectron2.data.build_detection_test_loader
    dataset: {_target_: detectron2.data.get_detection_dataset_dicts, filter_empty: false, names: egosurgery_val}
    mapper:
      _target_: detrex.data.DetrDatasetMapper
      augmentation:
      - {_target_: detectron2.data.transforms.ResizeShortestEdge, max_size: 1333, short_edge_length: 800}
      augmentation_with_crop: null
      img_format: RGB
      is_train: false
      mask_on: false
    num_workers: 4
  train:
    _target_: detectron2.data.build_detection_train_loader
    dataset: {_target_: detectron2.data.get_detection_dataset_dicts, names: egosurgery_train}
    mapper:
      _target_: detrex.data.DetrDatasetMapper
      augmentation:
      - {_target_: detectron2.data.transforms.RandomFlip}
      - _target_: detectron2.data.transforms.ResizeShortestEdge
        max_size: 1333
        sample_style: choice
        short_edge_length: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
      augmentation_with_crop:
      - {_target_: detectron2.data.transforms.RandomFlip}
      - _target_: detectron2.data.transforms.ResizeShortestEdge
        sample_style: choice
        short_edge_length: [400, 500, 600]
      - _target_: detectron2.data.transforms.RandomCrop
        crop_size: [384, 600]
        crop_type: absolute_range
      - _target_: detectron2.data.transforms.ResizeShortestEdge
        max_size: 1333
        sample_style: choice
        short_edge_length: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
      img_format: RGB
      is_train: true
      mask_on: false
    num_workers: 8
    total_batch_size: 4
lr_multiplier:
  _target_: detectron2.solver.WarmupParamScheduler
  scheduler:
    _target_: fvcore.common.param_scheduler.MultiStepParamScheduler
    milestones: [26565, 28980]
    values: [1.0, 0.1]
  warmup_factor: 0.001
  warmup_length: 0.000862663906142167
  warmup_method: linear
model:
  _target_: projects.mr_detr_dino.modeling.DeformableDETR
  as_two_stage: true
  aux_loss: true
  backbone:
    _target_: detectron2.modeling.ResNet
    freeze_at: 1
    out_features: [res3, res4, res5]
    stages: {_target_: detectron2.modeling.ResNet.make_default_stages, depth: 50, norm: FrozenBN, stride_in_1x1: false}
    stem: {_target_: detectron2.modeling.backbone.BasicStem, in_channels: 3, norm: FrozenBN, out_channels: 64}
  criterion:
    _target_: projects.mr_detr_dino.modeling.DNCriterion
    alpha: 0.25
    enc_matcher: {_target_: detrex.modeling.HungarianMatcher, alpha: 0.25, cost_bbox: 5.0, cost_class: 0.0, cost_class_type: focal_loss_cost, cost_giou: 2.0, gamma: 2.0}
    gamma: 2.0
    loss_class_type: focal_loss
    matcher: {_target_: detrex.modeling.HungarianMatcher, alpha: 0.25, cost_bbox: 5.0, cost_class: 2.0, cost_class_type: focal_loss_cost, cost_giou: 2.0, gamma: 2.0}
    num_classes: 15
    weight_dict: {loss_bbox: 5.0, loss_bbox_0: 5.0, loss_bbox_1: 5.0, loss_bbox_2: 5.0, loss_bbox_3: 5.0, loss_bbox_4: 5.0, loss_bbox_dn: 5.0, loss_bbox_dn_0: 5.0, loss_bbox_dn_1: 5.0, loss_bbox_dn_2: 5.0, loss_bbox_dn_3: 5.0, loss_bbox_dn_4: 5.0, loss_bbox_dn_group: 5.0, loss_bbox_dn_group_0: 5.0, loss_bbox_dn_group_1: 5.0, loss_bbox_dn_group_2: 5.0, loss_bbox_dn_group_3: 5.0, loss_bbox_dn_group_4: 5.0, loss_bbox_dn_group_5: 5.0, loss_bbox_dn_o2m: 5.0, loss_bbox_dn_o2m_0: 5.0, loss_bbox_dn_o2m_1: 5.0, loss_bbox_dn_o2m_2: 5.0, loss_bbox_dn_o2m_3: 5.0, loss_bbox_dn_o2m_4: 5.0, loss_bbox_dn_o2m_5: 5.0, loss_bbox_dn_sep: 5.0, loss_bbox_dn_sep_0: 5.0, loss_bbox_dn_sep_1: 5.0, loss_bbox_dn_sep_2: 5.0, loss_bbox_dn_sep_3: 5.0, loss_bbox_dn_sep_4: 5.0, loss_bbox_dn_sep_5: 5.0, loss_bbox_enc: 5.0, loss_bbox_enc_o2m: 5.0, loss_bbox_enc_sep: 5.0, loss_bbox_group_0: 5.0, loss_bbox_group_1: 5.0, loss_bbox_group_2: 5.0, loss_bbox_group_3: 5.0, loss_bbox_group_4: 5.0, loss_bbox_group_5: 5.0, loss_bbox_o2m_0: 5.0, loss_bbox_o2m_1: 5.0, loss_bbox_o2m_2: 5.0, loss_bbox_o2m_3: 5.0, loss_bbox_o2m_4: 5.0, loss_bbox_o2m_5: 5.0, loss_bbox_sep_0: 5.0, loss_bbox_sep_1: 5.0, loss_bbox_sep_2: 5.0, loss_bbox_sep_3: 5.0, loss_bbox_sep_4: 5.0, loss_bbox_sep_5: 5.0, loss_class: 2.0, loss_class_0: 2.0, loss_class_1: 2.0, loss_class_2: 2.0, loss_class_3: 2.0, loss_class_4: 2.0, loss_class_dn: 2.0, loss_class_dn_0: 2.0, loss_class_dn_1: 2.0, loss_class_dn_2: 2.0, loss_class_dn_3: 2.0, loss_class_dn_4: 2.0, loss_class_dn_group: 2.0, loss_class_dn_group_0: 2.0, loss_class_dn_group_1: 2.0, loss_class_dn_group_2: 2.0, loss_class_dn_group_3: 2.0, loss_class_dn_group_4: 2.0, loss_class_dn_group_5: 2.0, loss_class_dn_o2m: 2.0, loss_class_dn_o2m_0: 2.0, loss_class_dn_o2m_1: 2.0, loss_class_dn_o2m_2: 2.0, loss_class_dn_o2m_3: 2.0, loss_class_dn_o2m_4: 2.0, loss_class_dn_o2m_5: 2.0, loss_class_dn_sep: 2.0, loss_class_dn_sep_0: 2.0, loss_class_dn_sep_1: 2.0, loss_class_dn_sep_2: 2.0, loss_class_dn_sep_3: 2.0, loss_class_dn_sep_4: 2.0, loss_class_dn_sep_5: 2.0, loss_class_enc: 2.0, loss_class_enc_o2m: 2.0, loss_class_enc_sep: 2.0, loss_class_group_0: 2.0, loss_class_group_1: 2.0, loss_class_group_2: 2.0, loss_class_group_3: 2.0, loss_class_group_4: 2.0, loss_class_group_5: 2.0, loss_class_o2m_0: 2.0, loss_class_o2m_1: 2.0, loss_class_o2m_2: 2.0, loss_class_o2m_3: 2.0, loss_class_o2m_4: 2.0, loss_class_o2m_5: 2.0, loss_class_sep_0: 2.0, loss_class_sep_1: 2.0, loss_class_sep_2: 2.0, loss_class_sep_3: 2.0, loss_class_sep_4: 2.0, loss_class_sep_5: 2.0, loss_giou: 2.0, loss_giou_0: 2.0, loss_giou_1: 2.0, loss_giou_2: 2.0, loss_giou_3: 2.0, loss_giou_4: 2.0, loss_giou_dn: 2.0, loss_giou_dn_0: 2.0, loss_giou_dn_1: 2.0, loss_giou_dn_2: 2.0, loss_giou_dn_3: 2.0, loss_giou_dn_4: 2.0, loss_giou_dn_group: 2.0, loss_giou_dn_group_0: 2.0, loss_giou_dn_group_1: 2.0, loss_giou_dn_group_2: 2.0, loss_giou_dn_group_3: 2.0, loss_giou_dn_group_4: 2.0, loss_giou_dn_group_5: 2.0, loss_giou_dn_o2m: 2.0, loss_giou_dn_o2m_0: 2.0, loss_giou_dn_o2m_1: 2.0, loss_giou_dn_o2m_2: 2.0, loss_giou_dn_o2m_3: 2.0, loss_giou_dn_o2m_4: 2.0, loss_giou_dn_o2m_5: 2.0, loss_giou_dn_sep: 2.0, loss_giou_dn_sep_0: 2.0, loss_giou_dn_sep_1: 2.0, loss_giou_dn_sep_2: 2.0, loss_giou_dn_sep_3: 2.0, loss_giou_dn_sep_4: 2.0, loss_giou_dn_sep_5: 2.0, loss_giou_enc: 2.0, loss_giou_enc_o2m: 2.0, loss_giou_enc_sep: 2.0, loss_giou_group_0: 2.0, loss_giou_group_1: 2.0, loss_giou_group_2: 2.0, loss_giou_group_3: 2.0, loss_giou_group_4: 2.0, loss_giou_group_5: 2.0, loss_giou_o2m_0: 2.0, loss_giou_o2m_1: 2.0, loss_giou_o2m_2: 2.0, loss_giou_o2m_3: 2.0, loss_giou_o2m_4: 2.0, loss_giou_o2m_5: 2.0, loss_giou_sep_0: 2.0, loss_giou_sep_1: 2.0, loss_giou_sep_2: 2.0, loss_giou_sep_3: 2.0, loss_giou_sep_4: 2.0, loss_giou_sep_5: 2.0}
  device: cuda
  dn_box_noise_scale: 0.4
  dn_label_noise_ratio: 0.5
  embed_dim: 256
  mixed_selection: true
  neck:
    _target_: detrex.modeling.ChannelMapper
    in_features: [res3, res4, res5]
    input_shapes:
      res3: !!python/object:detectron2.layers.shape_spec.ShapeSpec {channels: 512, height: null, stride: null, width: null}
      res4: !!python/object:detectron2.layers.shape_spec.ShapeSpec {channels: 1024, height: null, stride: null, width: null}
      res5: !!python/object:detectron2.layers.shape_spec.ShapeSpec {channels: 2048, height: null, stride: null, width: null}
    kernel_size: 1
    norm_layer: {_target_: torch.nn.GroupNorm, num_channels: 256, num_groups: 32}
    num_outs: 4
    out_channels: 256
  num_classes: 15
  num_queries: 900
  pixel_mean: [123.675, 116.28, 103.53]
  pixel_std: [58.395, 57.12, 57.375]
  position_embedding: {_target_: detrex.layers.PositionEmbeddingSine, normalize: true, num_pos_feats: 128, offset: -0.5, temperature: 10000}
  select_box_nums_for_evaluation: 300
  transformer:
    _target_: projects.mr_detr_dino.modeling.DeformableDetrTransformer
    as_two_stage: ${..as_two_stage}
    decoder: {_target_: projects.mr_detr_dino.modeling.DeformableDetrTransformerDecoder, attn_dropout: 0.0, embed_dim: 256, feedforward_dim: 2048, ffn_dropout: 0.0, look_forward_twice: true, num_feature_levels: '${..num_feature_levels}', num_heads: 8, num_layers: 6, return_intermediate: true}
    encoder: {_target_: projects.mr_detr_dino.modeling.DeformableDetrTransformerEncoder, attn_dropout: 0.0, embed_dim: 256, feedforward_dim: 2048, ffn_dropout: 0.0, num_feature_levels: '${..num_feature_levels}', num_heads: 8, num_layers: 6, post_norm: false}
    mixed_selection: true
    num_feature_levels: 4
    two_stage_num_proposals: ${..num_queries}
  with_box_refine: true
optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  lr: 0.0001
  params: {_target_: detectron2.solver.get_default_optimizer_params, base_lr: '${..lr}', lr_factor_func: !!python/name:None.%3Clambda%3E '', weight_decay_norm: 0.0}
  weight_decay: 0.0001
train:
  amp: {enabled: false}
  checkpointer: {max_to_keep: 100, period: 2415}
  clip_grad:
    enabled: true
    params: {max_norm: 0.1, norm_type: 2}
  ddp: {broadcast_buffers: false, find_unused_parameters: false, fp16_compression: false}
  device: cuda
  eval_period: 2415
  fast_dev_run: {enabled: false}
  init_checkpoint: /home/ubuntu/slocal2/m2/data/external/weights/mrdetr_dino_r50_12ep_coco.pth
  log_period: 50
  max_iter: 28980
  model_ema: {decay: 0.999, device: '', enabled: false, use_ema_weights_for_eval_only: false}
  output_dir: /tmp/mrdetr_dino_work_seed456
  seed: 456
  wandb:
    enabled: true
    params: {dir: /tmp/mrdetr_dino_work, name: mrdetr_dino_r50_seed456, project: egosurgery_multitask}
