task_id: T-2026-09-27-stage1-ptower-20
step: stage1_ptower_20
action: finetune
# P20 = 15 動画 + 追加 17〜21 を train のみに足す。P15 はホスト差の対照（三周目と同じデータ）
data_setting: P20
fold: A
seed: 42

# 初期化の鎖（掃引の 1 軸）。coco = D*-COCO が出発する checkpoint の backbone 部分
init: coco

# backbone の fine-tune
ft_lr: 0.0001
ft_weight_decay: 0.0001
# 装置に収まる最大が 16（64 と 32 は OOM）。勾配累積 4 で実効 batch 64 を保つ
ft_batch_size: 16
ft_accum_steps: 4
ft_epochs: 36
ft_patience: 4
ft_lr_decay: 0.1
backbone_tag: coco_r50_ft_800
checkpoint: null
verify_determinism: false

# 時間ヘッド（一周目・二周目と同一。stage1_ptower.train がそのまま読む）
candidate: A
layers: 6
smoothing_weight: 0.0
history: 30
epochs: 50
patience: 10
lr: 0.0005
weight_decay: 0.01
warmup_epochs: 2
maps: 64
desc_suffix: ""

device: cuda:0
cache: null
manifest_dir: data/processed/stage1_features/p20_manifest
batch_size: 16
workers: 4
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
